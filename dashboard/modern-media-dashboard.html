<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Media Server Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/socket.io-client@4/dist/socket.io.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap');
        
        :root {
            --primary: #3b82f6;
            --secondary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text);
            overflow-x: hidden;
        }

        .gradient-bg {
            background: linear-gradient(135deg, var(--background) 0%, #1a202c 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 0.3);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.2);
            transition: all 0.3s ease;
        }

        .status-online {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .status-offline {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--error);
            color: var(--error);
        }

        .status-warning {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--warning);
            color: var(--warning);
        }

        .metric-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(51, 65, 85, 0.5) 100%);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .progress-bar {
            background: rgba(51, 65, 85, 0.5);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 1s ease-in-out;
        }

        .pulse-dot {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .floating-animation {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .slide-in {
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .connection-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .connection-online {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .connection-offline {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .mobile-nav {
            display: none;
        }

        @media (max-width: 768px) {
            .desktop-nav {
                display: none;
            }
            .mobile-nav {
                display: flex;
            }
            .grid-responsive {
                grid-template-columns: 1fr !important;
            }
        }

        .auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 1001;
            padding: 16px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            animation: slideInRight 0.3s ease-out;
            max-width: 400px;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .notification-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .notification-warning {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid var(--warning);
            color: var(--warning);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;
        const { motion, AnimatePresence } = Motion;
        
        // API Configuration
        const API_BASE_URL = 'http://localhost:3002';
        const WS_URL = 'ws://localhost:3002';
        
        // Utility functions
        const formatBytes = (bytes) => {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        };

        const formatUptime = (seconds) => {
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${days}d ${hours}h ${minutes}m`;
        };

        const formatLastSeen = (timestamp) => {
            const now = new Date();
            const then = new Date(timestamp);
            const diff = Math.floor((now - then) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            return `${Math.floor(diff / 86400)}d ago`;
        };

        // Custom hooks
        const useWebSocket = (url) => {
            const [socket, setSocket] = useState(null);
            const [isConnected, setIsConnected] = useState(false);
            const [data, setData] = useState({});

            useEffect(() => {
                const ws = new WebSocket(url);
                
                ws.onopen = () => {
                    setIsConnected(true);
                    setSocket(ws);
                    console.log('WebSocket connected');
                };

                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        setData(prev => ({ ...prev, [message.type]: message.data }));
                    } catch (error) {
                        console.error('WebSocket message parse error:', error);
                    }
                };

                ws.onclose = () => {
                    setIsConnected(false);
                    setSocket(null);
                    console.log('WebSocket disconnected');
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    setIsConnected(false);
                };

                return () => {
                    ws.close();
                };
            }, [url]);

            const sendMessage = useCallback((message) => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify(message));
                }
            }, [socket]);

            return { isConnected, data, sendMessage };
        };

        const useNotifications = () => {
            const [notifications, setNotifications] = useState([]);

            const addNotification = useCallback((type, message) => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, type, message }]);
                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== id));
                }, 5000);
            }, []);

            const removeNotification = useCallback((id) => {
                setNotifications(prev => prev.filter(n => n.id !== id));
            }, []);

            return { notifications, addNotification, removeNotification };
        };

        // Components
        const ConnectionIndicator = ({ isConnected }) => (
            <div className={`connection-indicator ${isConnected ? 'connection-online' : 'connection-offline'}`}>
                <div className={`w-2 h-2 rounded-full ${isConnected ? 'bg-green-500' : 'bg-red-500'} ${isConnected ? 'pulse-dot' : ''}`}></div>
                <span className="text-sm font-medium">
                    {isConnected ? 'Connected' : 'Disconnected'}
                </span>
            </div>
        );

        const Notification = ({ notification, onClose }) => (
            <motion.div
                initial={{ x: 400, opacity: 0 }}
                animate={{ x: 0, opacity: 1 }}
                exit={{ x: 400, opacity: 0 }}
                className={`notification notification-${notification.type}`}
            >
                <div className="flex justify-between items-start">
                    <div className="flex-1">
                        <p className="font-medium">{notification.message}</p>
                    </div>
                    <button 
                        onClick={() => onClose(notification.id)}
                        className="ml-4 opacity-70 hover:opacity-100"
                    >
                        ×
                    </button>
                </div>
            </motion.div>
        );

        const AuthModal = ({ isOpen, onClose, onLogin }) => {
            const [credentials, setCredentials] = useState({ username: '', password: '' });
            const [isLoading, setIsLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(credentials)
                    });
                    const data = await response.json();
                    if (data.success) {
                        localStorage.setItem('auth_token', data.data.token);
                        onLogin(data.data);
                        onClose();
                    }
                } catch (error) {
                    console.error('Login error:', error);
                } finally {
                    setIsLoading(false);
                }
            };

            if (!isOpen) return null;

            return (
                <div className="auth-modal">
                    <motion.div 
                        initial={{ scale: 0.9, opacity: 0 }}
                        animate={{ scale: 1, opacity: 1 }}
                        className="glass-card p-8 max-w-md w-full mx-4"
                    >
                        <h2 className="text-2xl font-bold mb-6 text-center">Login to Dashboard</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium mb-2">Username</label>
                                <input
                                    type="text"
                                    value={credentials.username}
                                    onChange={(e) => setCredentials(prev => ({ ...prev, username: e.target.value }))}
                                    className="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-2">Password</label>
                                <input
                                    type="password"
                                    value={credentials.password}
                                    onChange={(e) => setCredentials(prev => ({ ...prev, password: e.target.value }))}
                                    className="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500"
                                    required
                                />
                            </div>
                            <div className="flex gap-4">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={isLoading}
                                    className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50"
                                >
                                    {isLoading ? 'Logging in...' : 'Login'}
                                </button>
                            </div>
                        </form>
                    </motion.div>
                </div>
            );
        };

        const ServiceCard = ({ service, onAction }) => {
            const getStatusColor = () => {
                switch (service.status) {
                    case 'online': return 'text-green-400 border-green-400';
                    case 'offline': return 'text-red-400 border-red-400';
                    case 'loading': return 'text-yellow-400 border-yellow-400';
                    default: return 'text-gray-400 border-gray-400';
                }
            };

            return (
                <motion.div 
                    whileHover={{ scale: 1.02, y: -5 }}
                    className="glass-card p-6 group"
                >
                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-3">
                            <div className={`w-3 h-3 rounded-full ${service.status === 'online' ? 'bg-green-400' : service.status === 'offline' ? 'bg-red-400' : 'bg-yellow-400'} ${service.status === 'online' ? 'pulse-dot' : ''}`}></div>
                            <h3 className="font-semibold text-lg">{service.displayName || service.name}</h3>
                        </div>
                        <span className={`px-2 py-1 rounded-full text-xs border ${getStatusColor()}`}>
                            {service.status}
                        </span>
                    </div>

                    <p className="text-sm text-gray-400 mb-4">{service.description}</p>

                    {service.metrics && (
                        <div className="space-y-2 mb-4">
                            {service.metrics.cpu !== undefined && (
                                <div>
                                    <div className="flex justify-between text-xs mb-1">
                                        <span>CPU</span>
                                        <span>{service.metrics.cpu}%</span>
                                    </div>
                                    <div className="progress-bar h-1">
                                        <div 
                                            className="progress-fill bg-blue-500"
                                            style={{ width: `${service.metrics.cpu}%` }}
                                        ></div>
                                    </div>
                                </div>
                            )}
                            {service.metrics.memory !== undefined && (
                                <div>
                                    <div className="flex justify-between text-xs mb-1">
                                        <span>Memory</span>
                                        <span>{service.metrics.memory}%</span>
                                    </div>
                                    <div className="progress-bar h-1">
                                        <div 
                                            className="progress-fill bg-green-500"
                                            style={{ width: `${service.metrics.memory}%` }}
                                        ></div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    <div className="flex gap-2">
                        <button
                            onClick={() => onAction(service.name, 'open')}
                            className="flex-1 px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm"
                            disabled={service.status === 'offline'}
                        >
                            Open
                        </button>
                        <button
                            onClick={() => onAction(service.name, 'restart')}
                            className="px-3 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors text-sm"
                            disabled={service.status === 'loading'}
                        >
                            Restart
                        </button>
                        <button
                            onClick={() => onAction(service.name, service.status === 'online' ? 'stop' : 'start')}
                            className={`px-3 py-2 rounded-lg transition-colors text-sm ${
                                service.status === 'online' 
                                    ? 'bg-red-600 hover:bg-red-700' 
                                    : 'bg-green-600 hover:bg-green-700'
                            } text-white`}
                            disabled={service.status === 'loading'}
                        >
                            {service.status === 'online' ? 'Stop' : 'Start'}
                        </button>
                    </div>
                </motion.div>
            );
        };

        const MetricCard = ({ title, value, icon, color = 'blue', percentage }) => (
            <motion.div
                whileHover={{ scale: 1.05 }}
                className="metric-card glass-card p-6"
            >
                <div className="flex items-center justify-between mb-4">
                    <h3 className="font-medium text-gray-300">{title}</h3>
                    <div className={`w-8 h-8 rounded-lg bg-${color}-500/20 flex items-center justify-center`}>
                        <div className={`w-4 h-4 text-${color}-400`}>
                            {icon}
                        </div>
                    </div>
                </div>
                <div className="text-2xl font-bold mb-2">{value}</div>
                {percentage !== undefined && (
                    <div className="progress-bar h-2">
                        <div 
                            className={`progress-fill bg-${color}-500`}
                            style={{ width: `${percentage}%` }}
                        ></div>
                    </div>
                )}
            </motion.div>
        );

        const PerformanceChart = ({ data, title }) => {
            const canvasRef = React.useRef(null);
            const chartRef = React.useRef(null);

            useEffect(() => {
                if (canvasRef.current && data) {
                    const ctx = canvasRef.current.getContext('2d');
                    
                    if (chartRef.current) {
                        chartRef.current.destroy();
                    }

                    chartRef.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.labels || [],
                            datasets: [{
                                label: title,
                                data: data.values || [],
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: false
                                }
                            },
                            scales: {
                                x: {
                                    grid: {
                                        color: 'rgba(51, 65, 85, 0.5)'
                                    },
                                    ticks: {
                                        color: '#94a3b8'
                                    }
                                },
                                y: {
                                    grid: {
                                        color: 'rgba(51, 65, 85, 0.5)'
                                    },
                                    ticks: {
                                        color: '#94a3b8'
                                    }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartRef.current) {
                        chartRef.current.destroy();
                    }
                };
            }, [data, title]);

            return (
                <div className="glass-card p-6">
                    <h3 className="font-semibold text-lg mb-4">{title}</h3>
                    <div className="h-64">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        };

        const MediaLibraryBrowser = () => {
            const [selectedType, setSelectedType] = useState('movies');
            const [mediaItems, setMediaItems] = useState([]);
            const [loading, setLoading] = useState(false);

            const mediaTypes = [
                { id: 'movies', name: 'Movies', icon: '🎬' },
                { id: 'tv', name: 'TV Shows', icon: '📺' },
                { id: 'music', name: 'Music', icon: '🎵' },
                { id: 'books', name: 'Books', icon: '📚' }
            ];

            return (
                <div className="glass-card p-6">
                    <h3 className="font-semibold text-lg mb-6">Media Library</h3>
                    
                    <div className="flex gap-2 mb-6 overflow-x-auto">
                        {mediaTypes.map(type => (
                            <button
                                key={type.id}
                                onClick={() => setSelectedType(type.id)}
                                className={`flex items-center gap-2 px-4 py-2 rounded-lg whitespace-nowrap transition-colors ${
                                    selectedType === type.id 
                                        ? 'bg-blue-600 text-white' 
                                        : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                                }`}
                            >
                                <span>{type.icon}</span>
                                {type.name}
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                        {Array.from({ length: 12 }, (_, i) => (
                            <motion.div
                                key={i}
                                whileHover={{ scale: 1.05 }}
                                className="bg-gray-700 rounded-lg overflow-hidden cursor-pointer"
                            >
                                <div className="aspect-[3/4] bg-gradient-to-br from-blue-500/20 to-purple-500/20 flex items-center justify-center">
                                    <span className="text-4xl">
                                        {mediaTypes.find(t => t.id === selectedType)?.icon}
                                    </span>
                                </div>
                                <div className="p-3">
                                    <h4 className="font-medium text-sm truncate">Sample {selectedType} {i + 1}</h4>
                                    <p className="text-xs text-gray-400 mt-1">2024</p>
                                </div>
                            </motion.div>
                        ))}
                    </div>
                </div>
            );
        };

        const DownloadManager = () => {
            const [downloads, setDownloads] = useState([
                { id: 1, name: 'Sample Movie.mkv', progress: 75, speed: '15.2 MB/s', eta: '2m 30s', status: 'downloading' },
                { id: 2, name: 'TV Show S01E01.mp4', progress: 100, speed: '0 B/s', eta: 'Complete', status: 'completed' },
                { id: 3, name: 'Music Album.zip', progress: 45, speed: '8.7 MB/s', eta: '5m 12s', status: 'downloading' },
            ]);

            return (
                <div className="glass-card p-6">
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="font-semibold text-lg">Download Manager</h3>
                        <button className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            Add Download
                        </button>
                    </div>

                    <div className="space-y-4">
                        {downloads.map(download => (
                            <motion.div
                                key={download.id}
                                initial={{ opacity: 0, y: 20 }}
                                animate={{ opacity: 1, y: 0 }}
                                className="bg-gray-700/50 rounded-lg p-4"
                            >
                                <div className="flex justify-between items-start mb-2">
                                    <h4 className="font-medium truncate flex-1 mr-4">{download.name}</h4>
                                    <span className={`px-2 py-1 rounded text-xs ${
                                        download.status === 'downloading' ? 'bg-blue-600' :
                                        download.status === 'completed' ? 'bg-green-600' :
                                        'bg-gray-600'
                                    }`}>
                                        {download.status}
                                    </span>
                                </div>
                                
                                <div className="flex justify-between text-sm text-gray-400 mb-2">
                                    <span>{download.progress}%</span>
                                    <span>{download.speed} • {download.eta}</span>
                                </div>
                                
                                <div className="progress-bar h-2">
                                    <div 
                                        className={`progress-fill ${
                                            download.status === 'completed' ? 'bg-green-500' : 'bg-blue-500'
                                        }`}
                                        style={{ width: `${download.progress}%` }}
                                    ></div>
                                </div>
                            </motion.div>
                        ))}
                    </div>
                </div>
            );
        };

        const SettingsManager = () => {
            const [activeTab, setActiveTab] = useState('general');
            const [settings, setSettings] = useState({
                theme: 'dark',
                notifications: true,
                autoUpdates: false,
                refreshInterval: 30
            });

            const tabs = [
                { id: 'general', name: 'General' },
                { id: 'services', name: 'Services' },
                { id: 'security', name: 'Security' },
                { id: 'advanced', name: 'Advanced' }
            ];

            return (
                <div className="glass-card p-6">
                    <h3 className="font-semibold text-lg mb-6">Settings</h3>
                    
                    <div className="flex border-b border-gray-700 mb-6">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-4 py-2 font-medium transition-colors ${
                                    activeTab === tab.id 
                                        ? 'border-b-2 border-blue-500 text-blue-400' 
                                        : 'text-gray-400 hover:text-gray-300'
                                }`}
                            >
                                {tab.name}
                            </button>
                        ))}
                    </div>

                    <div className="space-y-6">
                        {activeTab === 'general' && (
                            <>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Theme</label>
                                    <select 
                                        value={settings.theme}
                                        onChange={(e) => setSettings(prev => ({ ...prev, theme: e.target.value }))}
                                        className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500"
                                    >
                                        <option value="dark">Dark</option>
                                        <option value="light">Light</option>
                                        <option value="auto">Auto</option>
                                    </select>
                                </div>

                                <div className="flex items-center justify-between">
                                    <div>
                                        <h4 className="font-medium">Enable Notifications</h4>
                                        <p className="text-sm text-gray-400">Receive alerts for system events</p>
                                    </div>
                                    <button
                                        onClick={() => setSettings(prev => ({ ...prev, notifications: !prev.notifications }))}
                                        className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${
                                            settings.notifications ? 'bg-blue-600' : 'bg-gray-600'
                                        }`}
                                    >
                                        <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${
                                            settings.notifications ? 'translate-x-6' : 'translate-x-1'
                                        }`}></span>
                                    </button>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-2">Refresh Interval (seconds)</label>
                                    <input
                                        type="number"
                                        value={settings.refreshInterval}
                                        onChange={(e) => setSettings(prev => ({ ...prev, refreshInterval: parseInt(e.target.value) }))}
                                        className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500"
                                        min="5"
                                        max="300"
                                    />
                                </div>
                            </>
                        )}

                        {activeTab === 'services' && (
                            <div className="space-y-4">
                                <h4 className="font-medium">Service Configuration</h4>
                                <p className="text-gray-400">Manage individual service settings and configurations.</p>
                                <button className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                                    Configure Services
                                </button>
                            </div>
                        )}

                        {activeTab === 'security' && (
                            <div className="space-y-4">
                                <h4 className="font-medium">Security Settings</h4>
                                <p className="text-gray-400">Manage authentication and access control.</p>
                                <button className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                                    Change Password
                                </button>
                            </div>
                        )}

                        {activeTab === 'advanced' && (
                            <div className="space-y-4">
                                <h4 className="font-medium">Advanced Configuration</h4>
                                <p className="text-gray-400">Advanced system settings and debugging options.</p>
                                <div className="flex gap-4">
                                    <button className="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors">
                                        Export Config
                                    </button>
                                    <button className="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors">
                                        Import Config
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Main Dashboard Component
        const Dashboard = () => {
            const [activeView, setActiveView] = useState('overview');
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [user, setUser] = useState(null);
            const [services, setServices] = useState([]);
            const [systemMetrics, setSystemMetrics] = useState(null);
            const [loading, setLoading] = useState(true);
            
            const { isConnected, data, sendMessage } = useWebSocket(WS_URL);
            const { notifications, addNotification, removeNotification } = useNotifications();

            // Check for existing auth token on mount
            useEffect(() => {
                const token = localStorage.getItem('auth_token');
                if (token) {
                    // Verify token validity
                    fetch(`${API_BASE_URL}/api/auth/me`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            setIsAuthenticated(true);
                            setUser(data.data);
                        } else {
                            localStorage.removeItem('auth_token');
                            setShowAuthModal(true);
                        }
                    })
                    .catch(() => {
                        localStorage.removeItem('auth_token');
                        setShowAuthModal(true);
                    });
                } else {
                    setShowAuthModal(true);
                }
            }, []);

            // Fetch initial data
            useEffect(() => {
                if (isAuthenticated) {
                    fetchServices();
                    fetchSystemMetrics();
                }
            }, [isAuthenticated]);

            // WebSocket message handling
            useEffect(() => {
                if (data.services) {
                    setServices(data.services);
                }
                if (data.metrics) {
                    setSystemMetrics(data.metrics);
                }
                if (data.notification) {
                    addNotification(data.notification.type, data.notification.message);
                }
            }, [data]);

            const fetchServices = async () => {
                try {
                    const token = localStorage.getItem('auth_token');
                    const response = await fetch(`${API_BASE_URL}/api/services`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    if (data.success) {
                        setServices(data.data.services || []);
                    }
                } catch (error) {
                    console.error('Failed to fetch services:', error);
                    addNotification('error', 'Failed to fetch services');
                } finally {
                    setLoading(false);
                }
            };

            const fetchSystemMetrics = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/health/metrics`);
                    const data = await response.json();
                    if (data.success) {
                        setSystemMetrics(data.data);
                    }
                } catch (error) {
                    console.error('Failed to fetch system metrics:', error);
                }
            };

            const handleServiceAction = async (serviceName, action) => {
                try {
                    const token = localStorage.getItem('auth_token');
                    let url = `${API_BASE_URL}/api/services/${action}`;
                    let method = 'POST';
                    let body = { services: [serviceName] };

                    if (action === 'open') {
                        const service = services.find(s => s.name === serviceName);
                        if (service && service.url) {
                            window.open(service.url, '_blank');
                            return;
                        }
                    }

                    const response = await fetch(url, {
                        method,
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(body)
                    });

                    const data = await response.json();
                    if (data.success) {
                        addNotification('success', `${serviceName} ${action} completed`);
                        fetchServices(); // Refresh services
                    } else {
                        addNotification('error', `Failed to ${action} ${serviceName}`);
                    }
                } catch (error) {
                    console.error(`Service ${action} error:`, error);
                    addNotification('error', `Failed to ${action} ${serviceName}`);
                }
            };

            const handleLogin = (userData) => {
                setIsAuthenticated(true);
                setUser(userData.user);
                addNotification('success', `Welcome back, ${userData.user.username}!`);
            };

            const handleLogout = () => {
                localStorage.removeItem('auth_token');
                setIsAuthenticated(false);
                setUser(null);
                setShowAuthModal(true);
                addNotification('success', 'Logged out successfully');
            };

            const navigationItems = [
                { id: 'overview', name: 'Overview', icon: '🏠' },
                { id: 'services', name: 'Services', icon: '⚙️' },
                { id: 'library', name: 'Media Library', icon: '🎬' },
                { id: 'downloads', name: 'Downloads', icon: '⬇️' },
                { id: 'performance', name: 'Performance', icon: '📊' },
                { id: 'settings', name: 'Settings', icon: '⚙️' }
            ];

            // Mock performance data for charts
            const performanceData = {
                cpu: {
                    labels: Array.from({ length: 10 }, (_, i) => `${i}m ago`),
                    values: Array.from({ length: 10 }, () => Math.random() * 100)
                },
                memory: {
                    labels: Array.from({ length: 10 }, (_, i) => `${i}m ago`),
                    values: Array.from({ length: 10 }, () => Math.random() * 100)
                },
                network: {
                    labels: Array.from({ length: 10 }, (_, i) => `${i}m ago`),
                    values: Array.from({ length: 10 }, () => Math.random() * 100)
                }
            };

            if (!isAuthenticated) {
                return (
                    <>
                        <div className="gradient-bg min-h-screen flex items-center justify-center">
                            <motion.div 
                                initial={{ scale: 0.5, opacity: 0 }}
                                animate={{ scale: 1, opacity: 1 }}
                                className="text-center"
                            >
                                <h1 className="text-6xl font-bold mb-4 bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                                    Media Server Dashboard
                                </h1>
                                <p className="text-xl text-gray-400 mb-8">Please log in to continue</p>
                                <button 
                                    onClick={() => setShowAuthModal(true)}
                                    className="px-8 py-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-lg"
                                >
                                    Login
                                </button>
                            </motion.div>
                        </div>
                        <AuthModal 
                            isOpen={showAuthModal} 
                            onClose={() => setShowAuthModal(false)} 
                            onLogin={handleLogin}
                        />
                    </>
                );
            }

            return (
                <div className="gradient-bg min-h-screen">
                    <ConnectionIndicator isConnected={isConnected} />
                    
                    {/* Notifications */}
                    <AnimatePresence>
                        {notifications.map(notification => (
                            <Notification 
                                key={notification.id} 
                                notification={notification} 
                                onClose={removeNotification} 
                            />
                        ))}
                    </AnimatePresence>

                    {/* Header */}
                    <header className="border-b border-gray-700 backdrop-blur-sm bg-gray-900/50">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-4">
                                    <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                                        Media Dashboard
                                    </h1>
                                    <div className="flex items-center gap-2 px-3 py-1 bg-green-500/20 rounded-full">
                                        <div className="w-2 h-2 bg-green-400 rounded-full pulse-dot"></div>
                                        <span className="text-sm text-green-400">
                                            {services.filter(s => s.status === 'online').length} / {services.length} Online
                                        </span>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-4">
                                    <span className="text-sm text-gray-400">
                                        Welcome, {user?.username}
                                    </span>
                                    <button 
                                        onClick={handleLogout}
                                        className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"
                                    >
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="flex">
                        {/* Sidebar Navigation */}
                        <nav className="w-64 min-h-screen border-r border-gray-700 backdrop-blur-sm bg-gray-900/30 desktop-nav">
                            <div className="p-6">
                                <div className="space-y-2">
                                    {navigationItems.map(item => (
                                        <button
                                            key={item.id}
                                            onClick={() => setActiveView(item.id)}
                                            className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors ${
                                                activeView === item.id 
                                                    ? 'bg-blue-600 text-white' 
                                                    : 'text-gray-300 hover:bg-gray-700'
                                            }`}
                                        >
                                            <span className="text-lg">{item.icon}</span>
                                            {item.name}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </nav>

                        {/* Mobile Navigation */}
                        <div className="fixed bottom-0 left-0 right-0 bg-gray-900/90 backdrop-blur-sm border-t border-gray-700 mobile-nav">
                            <div className="flex justify-around py-2">
                                {navigationItems.slice(0, 5).map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveView(item.id)}
                                        className={`flex flex-col items-center gap-1 px-3 py-2 rounded-lg transition-colors ${
                                            activeView === item.id 
                                                ? 'text-blue-400' 
                                                : 'text-gray-400'
                                        }`}
                                    >
                                        <span className="text-lg">{item.icon}</span>
                                        <span className="text-xs">{item.name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Main Content */}
                        <main className="flex-1 p-6 pb-20 md:pb-6">
                            <div className="max-w-7xl mx-auto">
                                {/* Overview */}
                                {activeView === 'overview' && (
                                    <motion.div
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        className="space-y-6"
                                    >
                                        {/* System Metrics */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 grid-responsive">
                                            <MetricCard 
                                                title="CPU Usage" 
                                                value={systemMetrics?.cpu?.usage ? `${systemMetrics.cpu.usage.toFixed(1)}%` : 'N/A'}
                                                percentage={systemMetrics?.cpu?.usage}
                                                icon={<div className="w-4 h-4 bg-blue-400 rounded"></div>}
                                                color="blue"
                                            />
                                            <MetricCard 
                                                title="Memory Usage" 
                                                value={systemMetrics?.memory ? formatBytes(systemMetrics.memory.used) : 'N/A'}
                                                percentage={systemMetrics?.memory?.percentage}
                                                icon={<div className="w-4 h-4 bg-green-400 rounded"></div>}
                                                color="green"
                                            />
                                            <MetricCard 
                                                title="Disk Usage" 
                                                value={systemMetrics?.disk ? formatBytes(systemMetrics.disk.used) : 'N/A'}
                                                percentage={systemMetrics?.disk?.percentage}
                                                icon={<div className="w-4 h-4 bg-yellow-400 rounded"></div>}
                                                color="yellow"
                                            />
                                            <MetricCard 
                                                title="Network I/O" 
                                                value={systemMetrics?.network ? formatBytes(systemMetrics.network.bytesIn + systemMetrics.network.bytesOut) : 'N/A'}
                                                icon={<div className="w-4 h-4 bg-purple-400 rounded"></div>}
                                                color="purple"
                                            />
                                        </div>

                                        {/* Services Grid */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 grid-responsive">
                                            {services.slice(0, 6).map(service => (
                                                <ServiceCard 
                                                    key={service.name} 
                                                    service={service} 
                                                    onAction={handleServiceAction}
                                                />
                                            ))}
                                        </div>
                                    </motion.div>
                                )}

                                {/* Services */}
                                {activeView === 'services' && (
                                    <motion.div
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        className="space-y-6"
                                    >
                                        <div className="flex justify-between items-center">
                                            <h2 className="text-2xl font-bold">Services Management</h2>
                                            <div className="flex gap-4">
                                                <button 
                                                    onClick={() => handleServiceAction('all', 'start')}
                                                    className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors"
                                                >
                                                    Start All
                                                </button>
                                                <button 
                                                    onClick={() => handleServiceAction('all', 'stop')}
                                                    className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"
                                                >
                                                    Stop All
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 grid-responsive">
                                            {services.map(service => (
                                                <ServiceCard 
                                                    key={service.name} 
                                                    service={service} 
                                                    onAction={handleServiceAction}
                                                />
                                            ))}
                                        </div>
                                    </motion.div>
                                )}

                                {/* Media Library */}
                                {activeView === 'library' && (
                                    <motion.div
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                    >
                                        <MediaLibraryBrowser />
                                    </motion.div>
                                )}

                                {/* Downloads */}
                                {activeView === 'downloads' && (
                                    <motion.div
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                    >
                                        <DownloadManager />
                                    </motion.div>
                                )}

                                {/* Performance */}
                                {activeView === 'performance' && (
                                    <motion.div
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        className="space-y-6"
                                    >
                                        <h2 className="text-2xl font-bold">Performance Monitoring</h2>
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                            <PerformanceChart data={performanceData.cpu} title="CPU Usage %" />
                                            <PerformanceChart data={performanceData.memory} title="Memory Usage %" />
                                        </div>
                                        <div className="grid grid-cols-1">
                                            <PerformanceChart data={performanceData.network} title="Network I/O (MB/s)" />
                                        </div>
                                    </motion.div>
                                )}

                                {/* Settings */}
                                {activeView === 'settings' && (
                                    <motion.div
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                    >
                                        <SettingsManager />
                                    </motion.div>
                                )}
                            </div>
                        </main>
                    </div>

                    <AuthModal 
                        isOpen={showAuthModal} 
                        onClose={() => setShowAuthModal(false)} 
                        onLogin={handleLogin}
                    />
                </div>
            );
        };

        // Render the app
        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
