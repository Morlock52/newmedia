<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Server Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        .status-online {
            background: #10b981;
        }
        
        .status-offline {
            background: #ef4444;
        }
        
        .status-error {
            background: #f59e0b;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .service-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
        }
        
        .service-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .service-info {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .service-info strong {
            color: #333;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            display: block;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.3s ease;
        }
        
        .button:hover {
            opacity: 0.9;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        
        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .download-queue {
            margin-top: 30px;
        }
        
        .queue-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Media Server Dashboard</h1>
            <p style="color: #666;">Real-time monitoring and control</p>
            <div id="connection-status" style="margin-top: 10px;">
                <span class="status-indicator status-offline" id="api-status"></span>
                <span id="api-status-text">Connecting to API...</span>
                <span style="margin-left: 20px;" class="status-indicator status-offline" id="ws-status"></span>
                <span id="ws-status-text">Connecting to WebSocket...</span>
            </div>
        </header>
        
        <div id="loading" class="loading">
            <div>⏳ Connecting to services...</div>
        </div>
        
        <div id="error" class="error-message" style="display: none;"></div>
        
        <div id="services" class="grid" style="display: none;"></div>
        
        <div class="card" id="stats-card" style="display: none;">
            <h2>📊 Media Library Statistics</h2>
            <div class="stats-grid" id="stats"></div>
        </div>
        
        <div class="card download-queue" id="queue-card" style="display: none;">
            <h2>📥 Download Queue</h2>
            <div id="queue"></div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:3333';
        let ws;
        
        // Connection status management
        function updateAPIStatus(connected, message = '') {
            const statusIndicator = document.getElementById('api-status');
            const statusText = document.getElementById('api-status-text');
            
            if (connected) {
                statusIndicator.className = 'status-indicator status-online';
                statusText.textContent = 'API Connected';
            } else {
                statusIndicator.className = 'status-indicator status-error';
                statusText.textContent = message || 'API Disconnected';
            }
        }
        
        function updateWebSocketStatus(connected, message = '') {
            const statusIndicator = document.getElementById('ws-status');
            const statusText = document.getElementById('ws-status-text');
            
            if (connected) {
                statusIndicator.className = 'status-indicator status-online';
                statusText.textContent = 'WebSocket Connected';
            } else {
                statusIndicator.className = 'status-indicator status-error';
                statusText.textContent = message || 'WebSocket Disconnected';
            }
        }
        
        // Service configurations
        const serviceConfigs = {
            sonarr: { icon: '📺', color: '#3498db', url: 'http://localhost:8989' },
            radarr: { icon: '🎬', color: '#e74c3c', url: 'http://localhost:7878' },
            lidarr: { icon: '🎵', color: '#9b59b6', url: 'http://localhost:8686' },
            prowlarr: { icon: '🔍', color: '#f39c12', url: 'http://localhost:9696' },
            jellyfin: { icon: '📱', color: '#8e44ad', url: 'http://localhost:8096' },
            qbittorrent: { icon: '⬇️', color: '#27ae60', url: 'http://localhost:8080' },
            bazarr: { icon: '💬', color: '#34495e', url: 'http://localhost:6767' },
            overseerr: { icon: '📋', color: '#e67e22', url: 'http://localhost:5056' },
            jellyseerr: { icon: '🎯', color: '#16a085', url: 'http://localhost:5055' },
            transmission: { icon: '🔄', color: '#d35400', url: 'http://localhost:9091' },
            sabnzbd: { icon: '📦', color: '#c0392b', url: 'http://localhost:8082' },
            homepage: { icon: '🏠', color: '#2c3e50', url: 'http://localhost:3000' }
        };
        
        async function fetchServices() {
            try {
                const response = await fetch(`${API_URL}/api/services/status`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const services = await response.json();
                displayServices(services);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('services').style.display = 'grid';
                
                // Clear any previous errors and update status
                document.getElementById('error').style.display = 'none';
                updateAPIStatus(true);
            } catch (error) {
                console.error('API Error:', error);
                updateAPIStatus(false, 'Connection Failed');
                showError(`Failed to connect to API server on port 3333. Error: ${error.message}`);
            }
        }
        
        async function fetchStats() {
            try {
                const response = await fetch(`${API_URL}/api/media/stats`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const stats = await response.json();
                displayStats(stats);
                document.getElementById('stats-card').style.display = 'block';
            } catch (error) {
                console.error('Failed to fetch stats:', error);
                // Display stats card with zero values on error
                displayStats({ movies: 0, series: 0, episodes: 0, artists: 0, albums: 0, tracks: 0 });
                document.getElementById('stats-card').style.display = 'block';
            }
        }
        
        async function fetchQueue() {
            try {
                const response = await fetch(`${API_URL}/api/downloads/queue`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const queue = await response.json();
                displayQueue(queue);
                if (queue.length > 0) {
                    document.getElementById('queue-card').style.display = 'block';
                }
            } catch (error) {
                console.error('Failed to fetch queue:', error);
                // Display empty queue on error
                displayQueue([]);
            }
        }
        
        function displayServices(services) {
            const container = document.getElementById('services');
            container.innerHTML = '';
            
            // Add configured services that aren't in the API response
            const allServices = [...services];
            Object.keys(serviceConfigs).forEach(name => {
                if (!services.find(s => s.name === name)) {
                    allServices.push({
                        name,
                        status: 'unknown',
                        message: 'Service running (not monitored)'
                    });
                }
            });
            
            allServices.forEach(service => {
                const config = serviceConfigs[service.name] || { 
                    icon: '📦', 
                    color: '#95a5a6',
                    url: '#'
                };
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="service-header">
                        <div class="service-icon" style="background: ${config.color}20; color: ${config.color};">
                            ${config.icon}
                        </div>
                        <div style="flex-grow: 1;">
                            <h2>
                                ${service.name.charAt(0).toUpperCase() + service.name.slice(1)}
                                <span class="status-indicator status-${service.status}"></span>
                            </h2>
                        </div>
                    </div>
                    <div class="service-info">
                        <div><strong>Status:</strong> ${service.status}</div>
                        ${service.version ? `<div><strong>Version:</strong> ${service.version}</div>` : ''}
                        ${service.message ? `<div><strong>Info:</strong> ${service.message}</div>` : ''}
                        ${service.error ? `<div style="color: #e74c3c;"><strong>Error:</strong> ${service.error}</div>` : ''}
                    </div>
                    <div style="margin-top: 15px;">
                        <button class="button" onclick="window.open('${config.url}', '_blank')">
                            Open Interface →
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        function displayStats(stats) {
            const container = document.getElementById('stats');
            container.innerHTML = `
                <div class="stat-item">
                    <span class="stat-value">${stats.movies || 0}</span>
                    <span class="stat-label">Movies</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">${stats.series || 0}</span>
                    <span class="stat-label">TV Shows</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">${stats.episodes || 0}</span>
                    <span class="stat-label">Episodes</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">${stats.artists || 0}</span>
                    <span class="stat-label">Artists</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">${stats.albums || 0}</span>
                    <span class="stat-label">Albums</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">${stats.tracks || 0}</span>
                    <span class="stat-label">Tracks</span>
                </div>
            `;
        }
        
        function displayQueue(queue) {
            const container = document.getElementById('queue');
            if (queue.length === 0) {
                container.innerHTML = '<p style="color: #666;">No active downloads</p>';
                return;
            }
            
            container.innerHTML = queue.map(item => `
                <div class="queue-item">
                    <div><strong>${item.title}</strong></div>
                    <div style="color: #666; font-size: 12px;">
                        Status: ${item.status} | Size: ${formatBytes(item.size)} | Service: ${item.service}
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${item.progress}%"></div>
                    </div>
                </div>
            `).join('');
        }
        
        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }
        
        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:3333');
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                updateWebSocketStatus(true);
            };
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'statusUpdate') {
                    displayServices(message.data);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateWebSocketStatus(false, 'Connection Error');
            };
            
            ws.onclose = () => {
                console.log('WebSocket disconnected, reconnecting in 5s...');
                updateWebSocketStatus(false, 'Reconnecting...');
                setTimeout(connectWebSocket, 5000);
            };
        }
        
        // Initialize
        fetchServices();
        fetchStats();
        fetchQueue();
        connectWebSocket();
        
        // Refresh periodically
        setInterval(() => {
            fetchStats();
            fetchQueue();
        }, 10000);
    </script>
</body>
</html>
