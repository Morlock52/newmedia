<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <meta name="apple-mobile-web-app-title" content="Media Server">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e293b">
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTgwIiBoZWlnaHQ9IjE4MCIgdmlld0JveD0iMCAwIDE4MCAxODAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiByeD0iNDAiIGZpbGw9IiMxZTI5M2IiLz4KPHN2ZyB4PSI0MCIgeT0iNDAiIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiBmaWxsPSIjMzk4MmY2Ij4KPHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiPgo8cGF0aCBkPSJNNTAgMEMyMi4zODYgMCAwIDIyLjM4NiAwIDUwUzIyLjM4NiAxMDAgNTAgMTAwUzEwMCA3Ny42MTQgMTAwIDUwUzc3LjYxNCAwIDUwIDBaTTc1IDU1SDI1VjQ1SDc1VjU1WiIgZmlsbD0id2hpdGUiLz4KPC9zdmc+Cjwvc3ZnPgo8L3N2Zz4K">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --safe-area-inset-top: env(safe-area-inset-top);
            --safe-area-inset-bottom: env(safe-area-inset-bottom);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .safe-area-top {
            padding-top: var(--safe-area-inset-top);
        }
        
        .safe-area-bottom {
            padding-bottom: var(--safe-area-inset-bottom);
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.3);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .touch-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .touch-card:active {
            transform: scale(0.95);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .status-online {
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }
        
        .status-offline {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }
        
        .status-loading {
            background: #f59e0b;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .progress-bar {
            background: rgba(51, 65, 85, 0.5);
            border-radius: 9999px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            border-radius: 9999px;
            transition: width 1s ease-in-out;
        }
        
        .floating-action-btn {
            position: fixed;
            bottom: calc(80px + var(--safe-area-inset-bottom));
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.4);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 1000;
        }
        
        .floating-action-btn:active {
            transform: scale(0.9);
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(51, 65, 85, 0.3);
            padding-bottom: var(--safe-area-inset-bottom);
        }
        
        .swipe-card {
            touch-action: pan-x;
        }
        
        .notification-banner {
            position: fixed;
            top: var(--safe-area-inset-top);
            left: 16px;
            right: 16px;
            z-index: 1001;
            background: rgba(16, 185, 129, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }
        
        .notification-banner.show {
            transform: translateY(16px);
        }
        
        /* Dark mode adjustments for mobile */
        @media (prefers-color-scheme: dark) {
            body {
                background: #000;
            }
            
            .glass-card {
                background: rgba(0, 0, 0, 0.8);
                border-color: rgba(255, 255, 255, 0.1);
            }
        }
        
        /* Haptic feedback simulation */
        .haptic-light:active {
            animation: hapticLight 0.1s ease-out;
        }
        
        @keyframes hapticLight {
            0% { transform: scale(1); }
            50% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }
        
        /* Pull to refresh */
        .pull-to-refresh {
            position: relative;
            overflow: hidden;
        }
        
        .pull-indicator {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border: 2px solid #3b82f6;
            border-top: 2px solid transparent;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        
        .pull-indicator.loading {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- PWA Manifest -->
    <script>
        const manifest = {
            name: "Media Server Dashboard",
            short_name: "MediaServer",
            description: "Mobile dashboard for media server management",
            start_url: "/",
            display: "standalone",
            background_color: "#0f172a",
            theme_color: "#1e293b",
            orientation: "portrait",
            icons: [
                {
                    src: "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgdmlld0JveD0iMCAwIDE5MiAxOTIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxOTIiIGhlaWdodD0iMTkyIiByeD0iNDgiIGZpbGw9IiMxZTI5M2IiLz4KPHN2ZyB4PSI0OCIgeT0iNDgiIHdpZHRoPSI5NiIgaGVpZ2h0PSI5NiIgZmlsbD0iIzM5ODJmNiI+Cjwvc3ZnPgo8L3N2Zz4K",
                    sizes: "192x192",
                    type: "image/svg+xml"
                }
            ]
        };
        
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        const { motion, AnimatePresence, PanInfo } = Motion;
        
        // Mobile-specific hooks
        const useSwipe = (onSwipeLeft, onSwipeRight, threshold = 50) => {
            const [touchStart, setTouchStart] = useState(0);
            const [touchEnd, setTouchEnd] = useState(0);
            
            const handleTouchStart = (e) => {
                setTouchStart(e.targetTouches[0].clientX);
            };
            
            const handleTouchMove = (e) => {
                setTouchEnd(e.targetTouches[0].clientX);
            };
            
            const handleTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                const isLeftSwipe = distance > threshold;
                const isRightSwipe = distance < -threshold;
                
                if (isLeftSwipe && onSwipeLeft) onSwipeLeft();
                if (isRightSwipe && onSwipeRight) onSwipeRight();
            };
            
            return {
                onTouchStart: handleTouchStart,
                onTouchMove: handleTouchMove,
                onTouchEnd: handleTouchEnd
            };
        };
        
        const usePullToRefresh = (onRefresh) => {
            const [isPulling, setIsPulling] = useState(false);
            const [pullDistance, setPullDistance] = useState(0);
            const startY = useRef(0);
            
            const handleTouchStart = (e) => {
                if (window.scrollY === 0) {
                    startY.current = e.touches[0].clientY;
                }
            };
            
            const handleTouchMove = (e) => {
                if (window.scrollY === 0 && startY.current) {
                    const currentY = e.touches[0].clientY;
                    const diff = currentY - startY.current;
                    
                    if (diff > 0) {
                        e.preventDefault();
                        setPullDistance(Math.min(diff, 100));
                        setIsPulling(diff > 60);
                    }
                }
            };
            
            const handleTouchEnd = () => {
                if (isPulling && onRefresh) {
                    onRefresh();
                }
                setIsPulling(false);
                setPullDistance(0);
                startY.current = 0;
            };
            
            return {
                isPulling,
                pullDistance,
                onTouchStart: handleTouchStart,
                onTouchMove: handleTouchMove,
                onTouchEnd: handleTouchEnd
            };
        };
        
        // Mobile Components
        const MobileServiceCard = ({ service, onTap, onSwipe }) => {
            const swipeHandlers = useSwipe(
                () => onSwipe && onSwipe(service.name, 'left'),
                () => onSwipe && onSwipe(service.name, 'right')
            );
            
            return (
                <motion.div
                    whileTap={{ scale: 0.95 }}
                    className="glass-card p-4 mb-3 touch-card swipe-card"
                    onClick={() => onTap && onTap(service)}
                    {...swipeHandlers}
                >
                    <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-3">
                            <div className={`status-indicator status-${service.status}`}></div>
                            <div>
                                <h3 className="font-semibold text-white">{service.displayName || service.name}</h3>
                                <p className="text-sm text-gray-400">{service.description}</p>
                            </div>
                        </div>
                        <div className="text-right">
                            <div className={`text-xs px-2 py-1 rounded-full ${
                                service.status === 'online' ? 'bg-green-500/20 text-green-400' :
                                service.status === 'offline' ? 'bg-red-500/20 text-red-400' :
                                'bg-yellow-500/20 text-yellow-400'
                            }`}>
                                {service.status}
                            </div>
                        </div>
                    </div>
                    
                    {service.metrics && (
                        <div className="grid grid-cols-2 gap-3">
                            {service.metrics.cpu !== undefined && (
                                <div>
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="text-gray-400">CPU</span>
                                        <span className="text-white">{service.metrics.cpu}%</span>
                                    </div>
                                    <div className="progress-bar h-2">
                                        <div 
                                            className="progress-fill"
                                            style={{ width: `${service.metrics.cpu}%` }}
                                        ></div>
                                    </div>
                                </div>
                            )}
                            {service.metrics.memory !== undefined && (
                                <div>
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="text-gray-400">Memory</span>
                                        <span className="text-white">{service.metrics.memory}%</span>
                                    </div>
                                    <div className="progress-bar h-2">
                                        <div 
                                            className="progress-fill"
                                            style={{ width: `${service.metrics.memory}%` }}
                                        ></div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </motion.div>
            );
        };
        
        const MobileMetricCard = ({ title, value, icon, color = '#3b82f6' }) => (
            <motion.div
                whileTap={{ scale: 0.95 }}
                className="glass-card p-4 touch-card haptic-light"
            >
                <div className="flex items-center justify-between mb-2">
                    <span className="text-sm text-gray-400">{title}</span>
                    <div style={{ color }} className="text-xl">{icon}</div>
                </div>
                <div className="text-xl font-bold text-white">{value}</div>
            </motion.div>
        );
        
        const MobileBottomSheet = ({ isOpen, onClose, title, children }) => (
            <AnimatePresence>
                {isOpen && (
                    <>
                        <motion.div
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            exit={{ opacity: 0 }}
                            className="fixed inset-0 bg-black/50 z-40"
                            onClick={onClose}
                        />
                        <motion.div
                            initial={{ y: '100%' }}
                            animate={{ y: 0 }}
                            exit={{ y: '100%' }}
                            drag="y"
                            dragConstraints={{ top: 0, bottom: 0 }}
                            dragElastic={0.2}
                            onDragEnd={(_, info) => {
                                if (info.offset.y > 150) {
                                    onClose();
                                }
                            }}
                            className="fixed bottom-0 left-0 right-0 bg-gray-900 rounded-t-3xl p-6 z-50 safe-area-bottom"
                            style={{ maxHeight: '80vh' }}
                        >
                            <div className="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-4"></div>
                            {title && (
                                <h2 className="text-xl font-bold text-white mb-4 text-center">{title}</h2>
                            )}
                            <div className="overflow-y-auto" style={{ maxHeight: 'calc(80vh - 120px)' }}>
                                {children}
                            </div>
                        </motion.div>
                    </>
                )}
            </AnimatePresence>
        );
        
        const NotificationBanner = ({ message, type = 'success', show, onClose }) => (
            <div className={`notification-banner ${show ? 'show' : ''}`}>
                <div className="flex items-center justify-between">
                    <span className="font-medium">{message}</span>
                    <button onClick={onClose} className="text-white/80 text-lg">×</button>
                </div>
            </div>
        );
        
        // Main Mobile App Component
        const MobileApp = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [services, setServices] = useState([]);
            const [systemMetrics, setSystemMetrics] = useState(null);
            const [selectedService, setSelectedService] = useState(null);
            const [showBottomSheet, setShowBottomSheet] = useState(false);
            const [notification, setNotification] = useState({ show: false, message: '', type: 'success' });
            const [isRefreshing, setIsRefreshing] = useState(false);
            
            const pullToRefresh = usePullToRefresh(() => {
                setIsRefreshing(true);
                setTimeout(() => {
                    fetchData();
                    setIsRefreshing(false);
                    showNotification('Refreshed successfully!');
                }, 1500);
            });
            
            const showNotification = (message, type = 'success') => {
                setNotification({ show: true, message, type });
                setTimeout(() => {
                    setNotification(prev => ({ ...prev, show: false }));
                }, 3000);
            };
            
            const fetchData = async () => {
                // Mock data for demo
                const mockServices = [
                    {
                        name: 'jellyfin',
                        displayName: 'Jellyfin',
                        description: 'Media Server',
                        status: 'online',
                        metrics: { cpu: 25, memory: 45 }
                    },
                    {
                        name: 'sonarr',
                        displayName: 'Sonarr',
                        description: 'TV Show Management',
                        status: 'online',
                        metrics: { cpu: 15, memory: 30 }
                    },
                    {
                        name: 'radarr',
                        displayName: 'Radarr',
                        description: 'Movie Management',
                        status: 'loading',
                        metrics: { cpu: 8, memory: 20 }
                    },
                    {
                        name: 'qbittorrent',
                        displayName: 'qBittorrent',
                        description: 'Torrent Client',
                        status: 'offline',
                        metrics: { cpu: 0, memory: 0 }
                    }
                ];
                
                const mockMetrics = {
                    cpu: { usage: 35 },
                    memory: { used: 6442450944, total: 16777216000, percentage: 38 },
                    disk: { used: 2147483648000, total: 4294967296000, percentage: 50 },
                    network: { bytesIn: 1048576000, bytesOut: 524288000 }
                };
                
                setServices(mockServices);
                setSystemMetrics(mockMetrics);
            };
            
            useEffect(() => {
                fetchData();
            }, []);
            
            const handleServiceTap = (service) => {
                setSelectedService(service);
                setShowBottomSheet(true);
            };
            
            const handleServiceSwipe = (serviceName, direction) => {
                if (direction === 'left') {
                    // Quick action - open service
                    showNotification(`Opening ${serviceName}...`);
                } else if (direction === 'right') {
                    // Quick action - restart service
                    showNotification(`Restarting ${serviceName}...`);
                }
            };
            
            const handleServiceAction = (action) => {
                if (selectedService) {
                    showNotification(`${action} ${selectedService.displayName}...`);
                    setShowBottomSheet(false);
                    
                    // Simulate action
                    setTimeout(() => {
                        showNotification(`${selectedService.displayName} ${action} completed!`);
                    }, 2000);
                }
            };
            
            const formatBytes = (bytes) => {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            };
            
            const tabs = [
                { id: 'home', icon: '🏠', label: 'Home' },
                { id: 'services', icon: '⚙️', label: 'Services' },
                { id: 'downloads', icon: '⬇️', label: 'Downloads' },
                { id: 'library', icon: '🎬', label: 'Library' },
                { id: 'settings', icon: '⚙️', label: 'Settings' }
            ];
            
            return (
                <div className="gradient-bg min-h-screen safe-area-top">
                    <NotificationBanner 
                        message={notification.message}
                        type={notification.type}
                        show={notification.show}
                        onClose={() => setNotification(prev => ({ ...prev, show: false }))}
                    />
                    
                    {/* Pull to refresh indicator */}
                    <div className="pull-to-refresh" {...pullToRefresh}>
                        <div className={`pull-indicator ${isRefreshing ? 'loading' : ''}`}></div>
                        
                        {/* Header */}
                        <header className="px-4 py-4 border-b border-gray-700/50">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-bold text-white">Media Server</h1>
                                    <p className="text-sm text-gray-400">
                                        {services.filter(s => s.status === 'online').length} of {services.length} services online
                                    </p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="w-3 h-3 bg-green-400 rounded-full"></div>
                                    <span className="text-sm text-green-400">Connected</span>
                                </div>
                            </div>
                        </header>
                        
                        {/* Content */}
                        <main className="px-4 py-4 pb-32">
                            {activeTab === 'home' && (
                                <div className="space-y-6">
                                    {/* System Metrics */}
                                    <div>
                                        <h2 className="text-lg font-semibold text-white mb-3">System Status</h2>
                                        <div className="grid grid-cols-2 gap-3">
                                            <MobileMetricCard 
                                                title="CPU"
                                                value={systemMetrics?.cpu ? `${systemMetrics.cpu.usage}%` : 'N/A'}
                                                icon="🖥️"
                                            />
                                            <MobileMetricCard 
                                                title="Memory"
                                                value={systemMetrics?.memory ? `${systemMetrics.memory.percentage}%` : 'N/A'}
                                                icon="💾"
                                            />
                                            <MobileMetricCard 
                                                title="Storage"
                                                value={systemMetrics?.disk ? `${systemMetrics.disk.percentage}%` : 'N/A'}
                                                icon="💿"
                                            />
                                            <MobileMetricCard 
                                                title="Network"
                                                value={systemMetrics?.network ? formatBytes(systemMetrics.network.bytesIn + systemMetrics.network.bytesOut) : 'N/A'}
                                                icon="📡"
                                            />
                                        </div>
                                    </div>
                                    
                                    {/* Recent Services */}
                                    <div>
                                        <h2 className="text-lg font-semibold text-white mb-3">Services</h2>
                                        {services.slice(0, 3).map(service => (
                                            <MobileServiceCard 
                                                key={service.name}
                                                service={service}
                                                onTap={handleServiceTap}
                                                onSwipe={handleServiceSwipe}
                                            />
                                        ))}
                                        <button 
                                            onClick={() => setActiveTab('services')}
                                            className="w-full glass-card p-3 text-center text-blue-400 font-medium"
                                        >
                                            View All Services
                                        </button>
                                    </div>
                                </div>
                            )}
                            
                            {activeTab === 'services' && (
                                <div>
                                    <h2 className="text-lg font-semibold text-white mb-4">All Services</h2>
                                    {services.map(service => (
                                        <MobileServiceCard 
                                            key={service.name}
                                            service={service}
                                            onTap={handleServiceTap}
                                            onSwipe={handleServiceSwipe}
                                        />
                                    ))}
                                </div>
                            )}
                            
                            {activeTab === 'downloads' && (
                                <div>
                                    <h2 className="text-lg font-semibold text-white mb-4">Downloads</h2>
                                    <div className="glass-card p-6 text-center">
                                        <div className="text-4xl mb-4">⬇️</div>
                                        <p className="text-gray-400">No active downloads</p>
                                    </div>
                                </div>
                            )}
                            
                            {activeTab === 'library' && (
                                <div>
                                    <h2 className="text-lg font-semibold text-white mb-4">Media Library</h2>
                                    <div className="glass-card p-6 text-center">
                                        <div className="text-4xl mb-4">🎬</div>
                                        <p className="text-gray-400">Library browser coming soon</p>
                                    </div>
                                </div>
                            )}
                            
                            {activeTab === 'settings' && (
                                <div>
                                    <h2 className="text-lg font-semibold text-white mb-4">Settings</h2>
                                    <div className="space-y-3">
                                        <div className="glass-card p-4 touch-card">
                                            <h3 className="font-semibold text-white">Notifications</h3>
                                            <p className="text-sm text-gray-400">Manage notification preferences</p>
                                        </div>
                                        <div className="glass-card p-4 touch-card">
                                            <h3 className="font-semibold text-white">Theme</h3>
                                            <p className="text-sm text-gray-400">Dark mode enabled</p>
                                        </div>
                                        <div className="glass-card p-4 touch-card">
                                            <h3 className="font-semibold text-white">About</h3>
                                            <p className="text-sm text-gray-400">Media Server Dashboard v1.0</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                    
                    {/* Floating Action Button */}
                    <button className="floating-action-btn haptic-light">
                        +
                    </button>
                    
                    {/* Bottom Navigation */}
                    <nav className="bottom-nav">
                        <div className="flex justify-around py-2">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex flex-col items-center gap-1 px-3 py-2 transition-colors haptic-light ${
                                        activeTab === tab.id ? 'text-blue-400' : 'text-gray-400'
                                    }`}
                                >
                                    <span className="text-xl">{tab.icon}</span>
                                    <span className="text-xs">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                    
                    {/* Service Control Bottom Sheet */}
                    <MobileBottomSheet
                        isOpen={showBottomSheet}
                        onClose={() => setShowBottomSheet(false)}
                        title={selectedService?.displayName}
                    >
                        {selectedService && (
                            <div className="space-y-4">
                                <div className="text-center">
                                    <div className={`inline-block status-indicator status-${selectedService.status} w-4 h-4 mb-2`}></div>
                                    <p className="text-gray-400">{selectedService.description}</p>
                                    <p className="text-sm text-gray-500 mt-1">Status: {selectedService.status}</p>
                                </div>
                                
                                {selectedService.metrics && (
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="text-center">
                                            <div className="text-2xl font-bold text-white">{selectedService.metrics.cpu}%</div>
                                            <div className="text-sm text-gray-400">CPU</div>
                                        </div>
                                        <div className="text-center">
                                            <div className="text-2xl font-bold text-white">{selectedService.metrics.memory}%</div>
                                            <div className="text-sm text-gray-400">Memory</div>
                                        </div>
                                    </div>
                                )}
                                
                                <div className="grid grid-cols-3 gap-3 mt-6">
                                    <button
                                        onClick={() => handleServiceAction('start')}
                                        className="py-3 bg-green-600 text-white rounded-lg font-medium"
                                        disabled={selectedService.status === 'online'}
                                    >
                                        Start
                                    </button>
                                    <button
                                        onClick={() => handleServiceAction('restart')}
                                        className="py-3 bg-blue-600 text-white rounded-lg font-medium"
                                    >
                                        Restart
                                    </button>
                                    <button
                                        onClick={() => handleServiceAction('stop')}
                                        className="py-3 bg-red-600 text-white rounded-lg font-medium"
                                        disabled={selectedService.status === 'offline'}
                                    >
                                        Stop
                                    </button>
                                </div>
                                
                                <button
                                    onClick={() => handleServiceAction('open')}
                                    className="w-full py-3 bg-gray-700 text-white rounded-lg font-medium mt-3"
                                    disabled={selectedService.status === 'offline'}
                                >
                                    Open Service
                                </button>
                            </div>
                        )}
                    </MobileBottomSheet>
                </div>
            );
        };
        
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swScript = `
                    const CACHE_NAME = 'media-dashboard-v1';
                    const urlsToCache = [
                        '/',
                        '/mobile-app.html',
                        'https://unpkg.com/react@18/umd/react.production.min.js',
                        'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
                        'https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css'
                    ];
                    
                    self.addEventListener('install', (event) => {
                        event.waitUntil(
                            caches.open(CACHE_NAME)
                                .then((cache) => cache.addAll(urlsToCache))
                        );
                    });
                    
                    self.addEventListener('fetch', (event) => {
                        event.respondWith(
                            caches.match(event.request)
                                .then((response) => {
                                    if (response) {
                                        return response;
                                    }
                                    return fetch(event.request);
                                })
                        );
                    });
                `;
                
                const swBlob = new Blob([swScript], { type: 'application/javascript' });
                const swURL = URL.createObjectURL(swBlob);
                
                navigator.serviceWorker.register(swURL)
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
        
        ReactDOM.render(<MobileApp />, document.getElementById('root'));
    </script>
</body>
</html>
