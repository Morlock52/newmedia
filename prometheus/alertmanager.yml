# Alertmanager Configuration for Media Server
# Handles routing, grouping, and notification of alerts

global:
  smtp_smarthost: '${SMTP_SERVER}:${SMTP_PORT}'
  smtp_from: '${ALERT_EMAIL_FROM}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

# Alert routing rules
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'media-server-admins'
  routes:
    # Critical infrastructure alerts
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 5m
      
    # Media service specific alerts
    - match:
        service: jellyfin
      receiver: 'media-service-alerts'
      
    - match:
        service: sonarr
      receiver: 'arr-service-alerts'
      
    - match:
        service: radarr
      receiver: 'arr-service-alerts'
      
    - match:
        service: prowlarr
      receiver: 'arr-service-alerts'
      
    # Download client alerts
    - match:
        service: qbittorrent
      receiver: 'download-alerts'
      
    - match:
        service: transmission
      receiver: 'download-alerts'
      
    # VPN alerts
    - match:
        service: gluetun
      receiver: 'vpn-alerts'
      group_wait: 1m
      repeat_interval: 30m
      
    # Infrastructure alerts
    - match:
        service: traefik
      receiver: 'infrastructure-alerts'
      
    - match:
        service: authelia
      receiver: 'security-alerts'
      
    # Storage alerts
    - match:
        alertname: DiskSpaceLow
      receiver: 'storage-alerts'
      repeat_interval: 1h
      
    # Performance alerts
    - match:
        alertname: HighCPUUsage
      receiver: 'performance-alerts'
      
    - match:
        alertname: HighMemoryUsage
      receiver: 'performance-alerts'

# Inhibition rules - suppress certain alerts when others are firing
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
    
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'HighCPUUsage|HighMemoryUsage|DiskSpaceLow'
    equal: ['instance']

# Receiver configurations
receivers:
  # Default receiver for general alerts
  - name: 'media-server-admins'
    email_configs:
      - to: '${ADMIN_EMAIL}'
        subject: '[Media Server] {{ .GroupLabels.alertname }} - {{ .Status | toUpper }}'
        body: |
          {{ range .Alerts }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Severity:** {{ .Labels.severity }}
          **Instance:** {{ .Labels.instance }}
          **Time:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          
          **Labels:**
          {{ range .Labels.SortedPairs }}
          - {{ .Name }}: {{ .Value }}
          {{ end }}
          {{ end }}
        headers:
          X-Priority: 'Normal'

  # Critical alerts with high priority
  - name: 'critical-alerts'
    email_configs:
      - to: '${ADMIN_EMAIL}'
        subject: '[CRITICAL] Media Server Alert - {{ .GroupLabels.alertname }}'
        body: |
          🚨 **CRITICAL ALERT** 🚨
          
          {{ range .Alerts }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Severity:** {{ .Labels.severity }}
          **Instance:** {{ .Labels.instance }}
          **Time:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          
          **Immediate Action Required!**
          
          **Labels:**
          {{ range .Labels.SortedPairs }}
          - {{ .Name }}: {{ .Value }}
          {{ end }}
          {{ end }}
        headers:
          X-Priority: 'High'
    
    # Optional: Add webhook for critical alerts
    webhook_configs:
      - url: 'http://webhook-manager:9000/hooks/critical-alert'
        send_resolved: true

  # Media service alerts
  - name: 'media-service-alerts'
    email_configs:
      - to: '${ADMIN_EMAIL}'
        subject: '[Media Services] {{ .GroupLabels.alertname }}'
        body: |
          📺 **Media Service Alert**
          
          {{ range .Alerts }}
          **Service:** {{ .Labels.service }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Instance:** {{ .Labels.instance }}
          **Time:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  # *arr services alerts
  - name: 'arr-service-alerts'
    email_configs:
      - to: '${ADMIN_EMAIL}'
        subject: '[*ARR Services] {{ .GroupLabels.alertname }}'
        body: |
          🎬 ***ARR Service Alert**
          
          {{ range .Alerts }}
          **Service:** {{ .Labels.service }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Instance:** {{ .Labels.instance }}
          **Time:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  # Download client alerts
  - name: 'download-alerts'
    email_configs:
      - to: '${ADMIN_EMAIL}'
        subject: '[Downloads] {{ .GroupLabels.alertname }}'
        body: |
          ⬇️ **Download Service Alert**
          
          {{ range .Alerts }}
          **Service:** {{ .Labels.service }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Instance:** {{ .Labels.instance }}
          **Time:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  # VPN alerts
  - name: 'vpn-alerts'
    email_configs:
      - to: '${ADMIN_EMAIL}'
        subject: '[VPN] {{ .GroupLabels.alertname }} - SECURITY NOTICE'
        body: |
          🔒 **VPN Service Alert - Security Notice**
          
          {{ range .Alerts }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Instance:** {{ .Labels.instance }}
          **Time:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          
          ⚠️ **Security Impact:** VPN connectivity may be compromised.
          Check download client protection immediately.
          {{ end }}
        headers:
          X-Priority: 'High'

  # Infrastructure alerts
  - name: 'infrastructure-alerts'
    email_configs:
      - to: '${ADMIN_EMAIL}'
        subject: '[Infrastructure] {{ .GroupLabels.alertname }}'
        body: |
          🏗️ **Infrastructure Alert**
          
          {{ range .Alerts }}
          **Component:** {{ .Labels.service }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Instance:** {{ .Labels.instance }}
          **Time:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  # Security alerts
  - name: 'security-alerts'
    email_configs:
      - to: '${ADMIN_EMAIL}'
        subject: '[SECURITY] {{ .GroupLabels.alertname }}'
        body: |
          🛡️ **Security Alert**
          
          {{ range .Alerts }}
          **Security Component:** {{ .Labels.service }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Instance:** {{ .Labels.instance }}
          **Time:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          
          **Security Review Required**
          {{ end }}
        headers:
          X-Priority: 'High'

  # Storage alerts
  - name: 'storage-alerts'
    email_configs:
      - to: '${ADMIN_EMAIL}'
        subject: '[Storage] {{ .GroupLabels.alertname }}'
        body: |
          💾 **Storage Alert**
          
          {{ range .Alerts }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Instance:** {{ .Labels.instance }}
          **Current Usage:** {{ .Annotations.current_value }}%
          **Time:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          
          **Action:** Consider cleaning up old downloads or expanding storage.
          {{ end }}

  # Performance alerts
  - name: 'performance-alerts'
    email_configs:
      - to: '${ADMIN_EMAIL}'
        subject: '[Performance] {{ .GroupLabels.alertname }}'
        body: |
          ⚡ **Performance Alert**
          
          {{ range .Alerts }}
          **Resource:** {{ .Labels.alertname }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Instance:** {{ .Labels.instance }}
          **Current Value:** {{ .Annotations.current_value }}
          **Time:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

# Templates for custom notification formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'