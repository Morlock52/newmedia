<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 01 – Introduction</title>
    <link rel="stylesheet" href="../../templates/slides.css" />
    <style>
      @media print { .remark-slide-scaler { box-shadow: none !important; } }
    </style>
  </head>
  <body>
    <textarea id="source" style="display:none"></textarea>
    <script src="https://remarkjs.com/downloads/remark-latest.min.js"></script>
    <script>
      (async function () {
        try {
          const res = await fetch('slides.md');
          const md = await res.text();
          document.getElementById('source').value = md;
          const slideshow = remark.create({
            highlightStyle: 'monokai',
            ratio: '16:9',
            navigation: { scroll: false },
          });
          window.slideshow = slideshow;
        } catch (e) {
          document.body.innerHTML = '<pre style="padding:24px">Could not load slides.md.\nRun training/bin/serve-training.sh and open this file via http://localhost:8080/…</pre>';
        }
      })();
    </script>
  </body>
  </html>
