# Fail2ban filter for Jellyfin authentication failures
# Protects against brute force attacks on Jellyfin login

[Definition]
failregex = ^.*Authentication request for .* has been denied \(IP: "<HOST>"\).*$
            ^.*Invalid username or password entered for user ".*" from "<HOST>".*$
            ^.*\[<HOST>\] Authentication failed.*$
            ^.*Failed login attempt for user .* from <HOST>.*$

ignoreregex =

[Init]
maxlines = 3
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S