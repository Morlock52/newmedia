# Fail2ban filter for API abuse detection
# Detects excessive API requests and potential scraping attempts

[Definition]
failregex = ^<HOST> - - \[.*\] "(GET|POST|PUT|DELETE) /api/.*" (4\d{2}|5\d{2}) .*$
            ^<HOST> - - \[.*\] ".*" 429 .*$
            ^<HOST> - - \[.*\] "(GET|POST|PUT|DELETE) /api/.*" \d+ \d+ ".*" ".*bot.*".*$
            ^<HOST> - - \[.*\] "(GET|POST|PUT|DELETE) /api/.*" \d+ \d+ ".*" "(curl|wget|python|scrapy).*".*$

ignoreregex = ^<HOST> - - \[.*\] "(GET|POST|PUT|DELETE) /api/.*" (200|201|202|204) .*$

[Init]
maxlines = 1
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S