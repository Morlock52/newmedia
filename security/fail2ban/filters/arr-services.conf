# Fail2ban filter for ARR services (Sonarr, Radarr, Prowlarr) API abuse
# Protects against unauthorized API access and abuse

[Definition]
failregex = ^<HOST> - - \[.*\] "(GET|POST|PUT|DELETE) /(sonarr|radarr|prowlarr)/api/.*" (401|403|429) .*$
            ^<HOST> - - \[.*\] ".*" 401 .* ".*" ".*" .*$
            ^<HOST> - - \[.*\] "(GET|POST|PUT|DELETE) /(sonarr|radarr|prowlarr)/api/.*" 400 .*$

ignoreregex = ^<HOST> - - \[.*\] "(GET|POST|PUT|DELETE) /(sonarr|radarr|prowlarr)/api/.*" (200|201|202|204) .*$

[Init]
maxlines = 1
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S