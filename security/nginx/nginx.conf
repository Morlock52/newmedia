# Nginx Security Configuration for Media Server
# High-security reverse proxy with rate limiting and security headers

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Security: Hide nginx version
server_tokens off;

# Performance and Security
worker_rlimit_nofile 65535;
worker_connections_limit 1024;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Hide server information
    more_set_headers 'Server: MediaServer';
    
    # Logging Format
    log_format security_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           '"$http_x_forwarded_for" rt=$request_time '
                           'ua="$upstream_addr" us="$upstream_status" '
                           'ut="$upstream_response_time" ul="$upstream_response_length" '
                           'cs=$upstream_cache_status';

    access_log /var/log/nginx/access.log security_log;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    
    # Security: Prevent buffer overflow attacks
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_requests 100;
    send_timeout 10;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=web_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
    
    # Connection Limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 20;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Upstream definitions with health checks
    upstream jellyfin_backend {
        server jellyfin:8096 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream sonarr_backend {
        server sonarr:8989 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    upstream radarr_backend {
        server radarr:7878 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    upstream prowlarr_backend {
        server prowlarr:9696 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    upstream qbittorrent_backend {
        server qbittorrent:8080 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    upstream grafana_backend {
        server grafana:3000 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # Default server block - returns 444 for unknown domains
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    # Health check endpoint
    server {
        listen 80;
        server_name health;
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Main server block
    server {
        listen 80;
        listen [::]:80;
        server_name ${DOMAIN} www.${DOMAIN};

        # Security: Block common attack patterns
        location ~ /\.(ht|svn|git) {
            deny all;
            return 444;
        }

        # Block suspicious requests
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE)$) {
            return 444;
        }

        # Block requests with no User-Agent
        if ($http_user_agent = "") {
            return 444;
        }

        # Rate limiting for different endpoints
        location ~* ^/(api|admin) {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            try_files $uri @backend;
        }

        # Jellyfin Media Server
        location /jellyfin {
            limit_req zone=web_limit burst=10 nodelay;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Security headers for media content
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            
            proxy_pass http://jellyfin_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            
            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 300s;
        }

        # Sonarr API with enhanced security
        location /sonarr {
            limit_req zone=api_limit burst=10 nodelay;
            
            # API key validation
            if ($arg_apikey = "") {
                return 401 "API Key Required";
            }
            
            proxy_pass http://sonarr_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Radarr API with enhanced security
        location /radarr {
            limit_req zone=api_limit burst=10 nodelay;
            
            proxy_pass http://radarr_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prowlarr Indexer Management
        location /prowlarr {
            limit_req zone=api_limit burst=5 nodelay;
            
            proxy_pass http://prowlarr_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # qBittorrent with IP restriction
        location /qbittorrent {
            # Restrict to local networks only
            allow 192.168.0.0/16;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
            
            limit_req zone=web_limit burst=5 nodelay;
            
            proxy_pass http://qbittorrent_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana Monitoring
        location /grafana {
            limit_req zone=web_limit burst=10 nodelay;
            
            proxy_pass http://grafana_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
            try_files $uri =404;
        }

        # Default location
        location / {
            limit_req zone=web_limit burst=10 nodelay;
            return 301 /jellyfin;
        }

        # Error pages
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /429.html {
            root /etc/nginx/html;
            internal;
        }
        
        location = /50x.html {
            root /etc/nginx/html;
            internal;
        }
    }

    # Include additional configurations
    include /etc/nginx/conf.d/*.conf;
}

# WebSocket upgrade handling
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}