version: '3.9'

# ============================================================================
# PRODUCTION-OPTIMIZED MEDIA SERVER STACK WITH TRAEFIK REVERSE PROXY
# ============================================================================
# Features:
# - Only 2 optimized networks (media-net + secure-net)
# - Traefik reverse proxy for SSL termination and routing
# - Hardware acceleration support
# - Resource limits for all services
# - Comprehensive health checks
# - Fixed port conflicts
# - Consistent volume mappings
# ============================================================================

x-common-variables: &common-variables
  TZ: ${TZ:-America/New_York}
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}

x-resource-limits: &resource-limits
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 2G
      reservations:
        cpus: '0.5'
        memory: 512M

x-high-resource-limits: &high-resource-limits
  deploy:
    resources:
      limits:
        cpus: '4.0'
        memory: 8G
      reservations:
        cpus: '1.0'
        memory: 2G

x-low-resource-limits: &low-resource-limits
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        cpus: '0.2'
        memory: 128M

x-common-healthcheck: &common-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

networks:
  # Primary media services network
  media-net:
    name: media-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: media-br0
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.mtu: "1500"
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
    labels:
      - "com.media-server.network.tier=media"

  # Secure network for management and monitoring
  secure-net:
    name: secure-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: secure-br0
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.mtu: "1500"
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/16
          gateway: 172.31.0.1
    labels:
      - "com.media-server.network.tier=secure"

volumes:
  # Media storage volumes
  media-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_PATH:-./media}
  downloads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOWNLOADS_PATH:-./downloads}
  
  # Configuration volumes with consistent naming
  jellyfin-config:
    driver: local
  plex-config:
    driver: local
  sonarr-config:
    driver: local
  radarr-config:
    driver: local
  lidarr-config:
    driver: local
  bazarr-config:
    driver: local
  prowlarr-config:
    driver: local
  qbittorrent-config:
    driver: local
  sabnzbd-config:
    driver: local
  
  # Database volumes
  postgres-data:
    driver: local
  redis-data:
    driver: local
  
  # Monitoring volumes
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

services:
  # ==================== REVERSE PROXY ====================
  
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - --api.dashboard=true
      - --api.debug=true
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      - --global.sendanonymoususage=false
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data/letsencrypt:/letsencrypt
    networks:
      - media-net
      - secure-net
    restart: unless-stopped
    <<: *low-resource-limits
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      <<: *common-healthcheck
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"

  # ==================== MEDIA SERVERS ====================
  
  jellyfin:
    image: jellyfin/jellyfin:10.9.11
    container_name: jellyfin
    environment:
      <<: *common-variables
      JELLYFIN_PublishedServerUrl: "https://jellyfin.${DOMAIN:-localhost}"
    volumes:
      - jellyfin-config:/config
      - jellyfin-config:/cache
      - media-data:/media:ro
      - /dev/dri:/dev/dri  # Intel QuickSync
    networks:
      - media-net
    restart: unless-stopped
    <<: *high-resource-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      <<: *common-healthcheck
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "homepage.group=Media Servers"
      - "homepage.name=Jellyfin"
      - "homepage.icon=jellyfin.png"
      - "homepage.href=https://jellyfin.${DOMAIN:-localhost}"
      - "homepage.description=Open Source Media Server"

  plex:
    image: plexinc/pms-docker:1.40.4.8679-424562606
    container_name: plex
    environment:
      <<: *common-variables
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      ADVERTISE_IP: "https://plex.${DOMAIN:-localhost}"
    volumes:
      - plex-config:/config
      - plex-config:/transcode
      - media-data:/media:ro
      - /dev/dri:/dev/dri  # Hardware acceleration
    networks:
      - media-net
    restart: unless-stopped
    <<: *high-resource-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.plex.entrypoints=websecure"
      - "traefik.http.routers.plex.tls.certresolver=letsencrypt"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
      - "homepage.group=Media Servers"
      - "homepage.name=Plex"
      - "homepage.icon=plex.png"
      - "homepage.href=https://plex.${DOMAIN:-localhost}"
      - "homepage.description=Premium Media Server"

  # ==================== *ARR SERVICES ====================
  
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.9
    container_name: sonarr
    environment:
      <<: *common-variables
    volumes:
      - sonarr-config:/config
      - media-data:/media
      - downloads:/downloads
    networks:
      - media-net
    restart: unless-stopped
    <<: *resource-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      <<: *common-healthcheck
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "homepage.group=Media Management"
      - "homepage.name=Sonarr"
      - "homepage.icon=sonarr.png"
      - "homepage.href=https://sonarr.${DOMAIN:-localhost}"
      - "homepage.description=TV Series Management"

  radarr:
    image: lscr.io/linuxserver/radarr:5.8.3
    container_name: radarr
    environment:
      <<: *common-variables
    volumes:
      - radarr-config:/config
      - media-data:/media
      - downloads:/downloads
    networks:
      - media-net
    restart: unless-stopped
    <<: *resource-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      <<: *common-healthcheck
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "homepage.group=Media Management"
      - "homepage.name=Radarr"
      - "homepage.icon=radarr.png"
      - "homepage.href=https://radarr.${DOMAIN:-localhost}"
      - "homepage.description=Movie Management"

  lidarr:
    image: lscr.io/linuxserver/lidarr:2.4.3
    container_name: lidarr
    environment:
      <<: *common-variables
    volumes:
      - lidarr-config:/config
      - media-data:/media
      - downloads:/downloads
    networks:
      - media-net
    restart: unless-stopped
    <<: *resource-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      <<: *common-healthcheck
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.lidarr.entrypoints=websecure"
      - "traefik.http.routers.lidarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
      - "homepage.group=Media Management"
      - "homepage.name=Lidarr"
      - "homepage.icon=lidarr.png"
      - "homepage.href=https://lidarr.${DOMAIN:-localhost}"
      - "homepage.description=Music Management"

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.4.4
    container_name: bazarr
    environment:
      <<: *common-variables
    volumes:
      - bazarr-config:/config
      - media-data:/media
    networks:
      - media-net
    restart: unless-stopped
    <<: *low-resource-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/api/system/status"]
      <<: *common-healthcheck
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "homepage.group=Media Management"
      - "homepage.name=Bazarr"
      - "homepage.icon=bazarr.png"
      - "homepage.href=https://bazarr.${DOMAIN:-localhost}"
      - "homepage.description=Subtitle Management"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.21.2
    container_name: prowlarr
    environment:
      <<: *common-variables
    volumes:
      - prowlarr-config:/config
    networks:
      - media-net
    restart: unless-stopped
    <<: *resource-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      <<: *common-healthcheck
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "homepage.group=Media Management"
      - "homepage.name=Prowlarr"
      - "homepage.icon=prowlarr.png"
      - "homepage.href=https://prowlarr.${DOMAIN:-localhost}"
      - "homepage.description=Indexer Management"

  # ==================== DOWNLOAD CLIENTS ====================
  
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.6.7
    container_name: qbittorrent
    environment:
      <<: *common-variables
      WEBUI_PORT: 8081
      QBT_EULA: "accept"
    volumes:
      - qbittorrent-config:/config
      - downloads:/downloads
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - media-net
    restart: unless-stopped
    <<: *resource-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v2/app/version"]
      <<: *common-healthcheck
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls.certresolver=letsencrypt"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8081"
      - "homepage.group=Downloads"
      - "homepage.name=qBittorrent"
      - "homepage.icon=qbittorrent.png"
      - "homepage.href=https://qbittorrent.${DOMAIN:-localhost}"
      - "homepage.description=Torrent Client"

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:4.3.3
    container_name: sabnzbd
    environment:
      <<: *common-variables
    volumes:
      - sabnzbd-config:/config
      - downloads:/downloads
    networks:
      - media-net
    restart: unless-stopped
    <<: *resource-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api?mode=version"]
      <<: *common-healthcheck
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.routers.sabnzbd.tls.certresolver=letsencrypt"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"
      - "homepage.group=Downloads"
      - "homepage.name=SABnzbd"
      - "homepage.icon=sabnzbd.png"
      - "homepage.href=https://sabnzbd.${DOMAIN:-localhost}"
      - "homepage.description=Usenet Downloader"

  # ==================== MONITORING ====================
  
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
      - '--web.external-url=https://prometheus.${DOMAIN:-localhost}'
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - secure-net
      - media-net
    restart: unless-stopped
    <<: *resource-limits
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      <<: *common-healthcheck
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN:-localhost}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - secure-net
      - media-net
    restart: unless-stopped
    <<: *resource-limits
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      <<: *common-healthcheck
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.15
    container_name: uptime-kuma
    volumes:
      - ./uptime-kuma-data:/app/data
    networks:
      - secure-net
      - media-net
    restart: unless-stopped
    <<: *low-resource-limits
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001 || exit 1"]
      <<: *common-healthcheck
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`uptime.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.routers.uptime.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"

  # ==================== MANAGEMENT ====================
  
  portainer:
    image: portainer/portainer-ce:2.21.0
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./portainer-data:/data
    networks:
      - secure-net
    restart: unless-stopped
    <<: *low-resource-limits
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/status"]
      <<: *common-healthcheck
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  # ==================== DASHBOARD ====================
  
  homepage:
    image: ghcr.io/gethomepage/homepage:v0.9.10
    container_name: homepage
    environment:
      <<: *common-variables
    volumes:
      - ./homepage-config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - media-net
      - secure-net
    restart: unless-stopped
    <<: *low-resource-limits
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      <<: *common-healthcheck
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls.certresolver=letsencrypt"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"

  # ==================== DATABASE SERVICES ====================
  
  postgres:
    image: postgres:16.4-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: ${POSTGRES_DB:-media_server}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - secure-net
    restart: unless-stopped
    <<: *resource-limits
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-media_server}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-securepassword}
    volumes:
      - redis-data:/data
    networks:
      - secure-net
    restart: unless-stopped
    <<: *low-resource-limits
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "auth", "${REDIS_PASSWORD:-securepassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== AUTO-UPDATER ====================
  
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - secure-net
    restart: unless-stopped
    <<: *low-resource-limits