version: '3.9'

# Ultimate Media Server 2025 - Single Container Deployment
# All 18 Components + 30+ Services in One Container

services:
  ultimate-media-server:
    image: ultimate-media-server:2025
    container_name: ultimate-media-server-2025
    build:
      context: .
      dockerfile: Dockerfile.ultimate-single-container
    restart: unless-stopped
    
    # Network mode - use bridge for best compatibility
    network_mode: bridge
    
    # Environment variables
    environment:
      # System
      - TZ=UTC
      - PUID=1000
      - PGID=1000
      - NODE_ENV=production
      
      # Database
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_NAME=mediaserver
      - DB_USER=mediaserver
      - DB_PASS=supersecure
      
      # Redis
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      
      # API Configuration
      - API_PORT=8080
      - API_KEY=your-api-key-here
      
      # WebSocket
      - WS_PORT=8081
      - WS_ENABLED=true
      
      # Media Paths
      - MEDIA_PATH=/media
      - DOWNLOADS_PATH=/downloads
      - TRANSCODES_PATH=/data/transcodes
      
      # Service URLs (for internal communication)
      - JELLYFIN_URL=http://localhost:8096
      - PLEX_URL=http://localhost:32400
      - EMBY_URL=http://localhost:8920
      - SONARR_URL=http://localhost:8989
      - RADARR_URL=http://localhost:7878
      - LIDARR_URL=http://localhost:8686
      - READARR_URL=http://localhost:8787
      - BAZARR_URL=http://localhost:6767
      - PROWLARR_URL=http://localhost:9696
      - QBITTORRENT_URL=http://localhost:8080
      - SABNZBD_URL=http://localhost:8081
      - TRANSMISSION_URL=http://localhost:9091
      - OVERSEERR_URL=http://localhost:5055
      - JELLYSEERR_URL=http://localhost:5056
      - TAUTULLI_URL=http://localhost:8181
      - GRAFANA_URL=http://localhost:3001
      - PROMETHEUS_URL=http://localhost:9090
      - UPTIME_KUMA_URL=http://localhost:3002
      
      # AI Services
      - AI_ENABLED=true
      - TENSORFLOW_ENABLED=true
      - ML_MODEL_PATH=/app/models
      - AI_PROCESSING_THREADS=4
      
      # Features
      - ENABLE_NOTIFICATIONS=true
      - ENABLE_ANALYTICS=true
      - ENABLE_PWA=true
      - ENABLE_VOICE_CONTROL=true
      - ENABLE_AR_VR=true
      - ENABLE_NEURAL_RECOMMENDATIONS=true
      - ENABLE_PREDICTIVE_ANALYTICS=true
      - ENABLE_SOCIAL_WATCH_PARTY=true
      
      # Security
      - ENABLE_2FA=true
      - JWT_SECRET=your-jwt-secret-here
      - OAUTH_ENABLED=true
      - CORS_ORIGINS=http://localhost:3000
      
      # Performance
      - MAX_WORKERS=8
      - CACHE_ENABLED=true
      - COMPRESSION_ENABLED=true
      
    # Port mappings
    ports:
      # Main Dashboard
      - "3000:3000"
      
      # API & WebSocket
      - "8080:8080"
      - "8081:8081"
      
      # Media Servers
      - "8096:8096"  # Jellyfin
      - "32400:32400"  # Plex
      - "8920:8920"  # Emby
      
      # *arr Stack
      - "8989:8989"  # Sonarr
      - "7878:7878"  # Radarr
      - "8686:8686"  # Lidarr
      - "8787:8787"  # Readarr
      - "6767:6767"  # Bazarr
      - "9696:9696"  # Prowlarr
      
      # Download Clients
      - "8082:8082"  # qBittorrent WebUI
      - "6881:6881"  # qBittorrent
      - "6881:6881/udp"  # qBittorrent
      - "9091:9091"  # Transmission
      - "8083:8083"  # SABnzbd
      
      # Request Management
      - "5055:5055"  # Overseerr
      - "5056:5056"  # Jellyseerr
      
      # Monitoring
      - "3001:3001"  # Grafana
      - "9090:9090"  # Prometheus
      - "3002:3002"  # Uptime Kuma
      - "8181:8181"  # Tautulli
      
      # Other Services
      - "8084:8084"  # Organizr
      - "8085:8085"  # Heimdall
      - "8086:8086"  # Homer
      - "9000:9000"  # Portainer
      - "81:81"  # Nginx Proxy Manager
      
      # Traefik (Reverse Proxy)
      - "80:80"
      - "443:443"
      - "8087:8087"  # Traefik Dashboard
      
    # Volume mounts
    volumes:
      # Configuration
      - ./config:/config
      - ./data:/data
      
      # Media Libraries
      - ./media/movies:/media/movies
      - ./media/tv:/media/tv
      - ./media/music:/media/music
      - ./media/books:/media/books
      - ./media/photos:/media/photos
      
      # Downloads
      - ./downloads:/downloads
      - ./downloads/complete:/downloads/complete
      - ./downloads/incomplete:/downloads/incomplete
      
      # Logs
      - ./logs:/logs
      
      # Database
      - ./postgres-data:/var/lib/postgresql/data
      - ./redis-data:/data/redis
      
      # AI Models
      - ./models:/app/models
      
      # Backups
      - ./backups:/backups
      
      # Docker socket (for container management)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 4G
          
    # Security options
    security_opt:
      - no-new-privileges:true
      
    # Capabilities
    cap_add:
      - NET_ADMIN  # For VPN support
      - SYS_MODULE  # For kernel modules
      
    # Devices (for hardware acceleration)
    devices:
      - /dev/dri:/dev/dri  # Intel QuickSync / GPU
      
    # Labels for Traefik
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # Dashboard
      - "traefik.http.routers.dashboard.rule=Host(`media.local`)"
      - "traefik.http.routers.dashboard.service=dashboard"
      - "traefik.http.services.dashboard.loadbalancer.server.port=3000"
      
      # API
      - "traefik.http.routers.api.rule=Host(`api.media.local`)"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      
      # Jellyfin
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.media.local`)"
      - "traefik.http.routers.jellyfin.service=jellyfin"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      
      # Plex
      - "traefik.http.routers.plex.rule=Host(`plex.media.local`)"
      - "traefik.http.routers.plex.service=plex"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
      
networks:
  default:
    name: media-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes definition (for named volumes if preferred)
volumes:
  config:
    driver: local
  data:
    driver: local
  media:
    driver: local
  downloads:
    driver: local
  logs:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  models:
    driver: local
  backups:
    driver: local