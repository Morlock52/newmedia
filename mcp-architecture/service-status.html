<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Media Server 2025 - Service Status</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4ecdc4">
    <meta name="description" content="Real-time service status monitoring for Ultimate Media Server 2025">
    <meta name="application-name" content="MediaServer">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Service Status">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png">
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #4ecdc4;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .service {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }
        
        .service:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .service-name {
            font-weight: bold;
            font-size: 18px;
        }
        
        .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status.online {
            background: #4ecdc4;
            color: #000;
        }
        
        .status.offline {
            background: #ff6b6b;
            color: #fff;
        }
        
        .status.checking {
            background: #ffc107;
            color: #000;
        }
        
        .service-url {
            font-size: 14px;
            color: #4ecdc4;
            text-decoration: none;
            display: inline-block;
            margin-top: 5px;
        }
        
        .service-url:hover {
            text-decoration: underline;
        }
        
        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 30px;
            background: #4ecdc4;
            color: #000;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .refresh-btn:hover {
            background: #45b7d1;
            transform: scale(1.05);
        }
        
        .summary {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .summary h2 {
            color: #4ecdc4;
            margin-bottom: 15px;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #4ecdc4;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Ultimate Media Server 2025 - Service Status</h1>
        
        <div class="summary">
            <h2>System Overview</h2>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="total-services">30</div>
                    <div class="stat-label">Total Services</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="online-services">0</div>
                    <div class="stat-label">Online</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="offline-services">0</div>
                    <div class="stat-label">Offline</div>
                </div>
            </div>
        </div>
        
        <button class="refresh-btn" onclick="checkAllServices()">🔄 Refresh Status</button>
        
        <div class="service-grid" id="services">
            <!-- Services will be populated here -->
        </div>
    </div>

    <script>
        const services = [
            // Core Services
            { name: 'MCP Dashboard', url: 'http://localhost:8090', port: 8090, category: 'core' },
            { name: 'MCP Server', url: 'http://localhost:3000/health', port: 3000, category: 'core' },
            
            // Media Servers
            { name: 'Jellyfin', url: 'http://localhost:8096', port: 8096, category: 'media' },
            { name: 'Plex', url: 'http://localhost:32400/web', port: 32400, category: 'media' },
            { name: 'Emby', url: 'http://localhost:8097', port: 8097, category: 'media' },
            
            // Content Management
            { name: 'Sonarr', url: 'http://localhost:8989', port: 8989, category: 'content' },
            { name: 'Radarr', url: 'http://localhost:7878', port: 7878, category: 'content' },
            { name: 'Lidarr', url: 'http://localhost:8686', port: 8686, category: 'content' },
            { name: 'Readarr', url: 'http://localhost:8787', port: 8787, category: 'content' },
            { name: 'Bazarr', url: 'http://localhost:6767', port: 6767, category: 'content' },
            
            // Indexers
            { name: 'Prowlarr', url: 'http://localhost:9696', port: 9696, category: 'indexer' },
            { name: 'Jackett', url: 'http://localhost:9117', port: 9117, category: 'indexer' },
            { name: 'FlareSolverr', url: 'http://localhost:8191', port: 8191, category: 'indexer' },
            
            // Download Clients
            { name: 'qBittorrent', url: 'http://localhost:8080', port: 8080, category: 'download' },
            { name: 'Transmission', url: 'http://localhost:9091', port: 9091, category: 'download' },
            { name: 'Deluge', url: 'http://localhost:8112', port: 8112, category: 'download' },
            { name: 'NZBGet', url: 'http://localhost:6789', port: 6789, category: 'download' },
            { name: 'SABnzbd', url: 'http://localhost:8085', port: 8085, category: 'download' },
            
            // Request Management
            { name: 'Overseerr', url: 'http://localhost:5055', port: 5055, category: 'request' },
            { name: 'Requestrr', url: 'http://localhost:4545', port: 4545, category: 'request' },
            { name: 'Ombi', url: 'http://localhost:3579', port: 3579, category: 'request' },
            
            // Analytics
            { name: 'Tautulli', url: 'http://localhost:8181', port: 8181, category: 'analytics' },
            { name: 'Netdata', url: 'http://localhost:19999', port: 19999, category: 'analytics' },
            
            // Dashboards
            { name: 'Homepage', url: 'http://localhost:3001', port: 3001, category: 'dashboard' },
            { name: 'Heimdall', url: 'http://localhost:80', port: 80, category: 'dashboard' },
            { name: 'Organizr', url: 'http://localhost:8081', port: 8081, category: 'dashboard' },
            { name: 'Homarr', url: 'http://localhost:7575', port: 7575, category: 'dashboard' },
            
            // Infrastructure
            { name: 'Nginx Proxy Manager', url: 'http://localhost:81', port: 81, category: 'infrastructure' },
            { name: 'Portainer', url: 'http://localhost:9000', port: 9000, category: 'infrastructure' },
            { name: 'Watchtower', url: 'http://localhost:8082', port: 8082, category: 'infrastructure' },
            { name: 'Gluetun VPN', url: 'http://localhost:8888', port: 8888, category: 'infrastructure' },
            { name: 'Unpackerr', url: 'http://localhost:5656', port: 5656, category: 'infrastructure' }
        ];
        
        let onlineCount = 0;
        let offlineCount = 0;
        
        function createServiceCard(service, status) {
            return `
                <div class="service">
                    <div class="service-header">
                        <span class="service-name">${service.name}</span>
                        <span class="status ${status}">${status.toUpperCase()}</span>
                    </div>
                    <div>Port: ${service.port}</div>
                    <a href="${service.url}" target="_blank" class="service-url">${service.url}</a>
                </div>
            `;
        }
        
        async function checkService(service) {
            const card = createServiceCard(service, 'checking');
            const serviceDiv = document.createElement('div');
            serviceDiv.innerHTML = card;
            document.getElementById('services').appendChild(serviceDiv.firstElementChild);
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                
                await fetch(service.url, {
                    mode: 'no-cors',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                // Update to online
                const element = document.getElementById('services').lastElementChild;
                element.querySelector('.status').className = 'status online';
                element.querySelector('.status').textContent = 'ONLINE';
                onlineCount++;
                
                return true;
            } catch (error) {
                // Update to offline
                const element = document.getElementById('services').lastElementChild;
                element.querySelector('.status').className = 'status offline';
                element.querySelector('.status').textContent = 'OFFLINE';
                offlineCount++;
                
                return false;
            }
        }
        
        async function checkAllServices() {
            document.getElementById('services').innerHTML = '';
            onlineCount = 0;
            offlineCount = 0;
            
            // Check services in parallel with slight delays to avoid overwhelming
            for (let i = 0; i < services.length; i++) {
                checkService(services[i]);
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            // Wait for all checks to complete
            setTimeout(() => {
                document.getElementById('online-services').textContent = onlineCount;
                document.getElementById('offline-services').textContent = offlineCount;
            }, 4000);
        }
        
        // Auto-check on load
        window.addEventListener('load', () => {
            checkAllServices();
            
            // PWA: Register for background sync
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({
                    type: 'BACKGROUND_SYNC',
                    tag: 'service-health-sync'
                });
            }
        });
        
        // PWA: Listen for data refresh events
        window.addEventListener('pwa-refresh-data', () => {
            console.log('🔄 PWA data refresh triggered');
            checkAllServices();
        });
        
        // PWA: Handle visibility changes for better performance
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                // Refresh when app becomes visible
                setTimeout(checkAllServices, 1000);
            }
        });
    </script>
    
    <!-- PWA Features Script -->
    <script src="/pwa-features.js" defer></script>
</body>
</html>
