[supervisord]
nodaemon=true
user=root
logfile=/opt/media-server/logs/supervisord.log
pidfile=/opt/media-server/supervisord.pid
childlogdir=/opt/media-server/logs

[unix_http_server]
file=/opt/media-server/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///opt/media-server/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ================================
# Media Servers (3 services)
# ================================

[program:jellyfin]
command=/usr/bin/jellyfin --service --datadir=/opt/media-server/config/jellyfin --cachedir=/opt/media-server/data/jellyfin/cache
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/jellyfin.log
stdout_logfile=/opt/media-server/logs/jellyfin.log
environment=JELLYFIN_DATA_DIR="/opt/media-server/config/jellyfin",JELLYFIN_CACHE_DIR="/opt/media-server/data/jellyfin/cache",JELLYFIN_LOG_DIR="/opt/media-server/logs"

[program:plex]
command=/usr/lib/plexmediaserver/Plex\ Media\ Server
user=plex
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/plex.log
stdout_logfile=/opt/media-server/logs/plex.log
environment=PLEX_MEDIA_SERVER_APPLICATION_SUPPORT_DIR="/opt/media-server/config/plex",PLEX_MEDIA_SERVER_HOME="/usr/lib/plexmediaserver"

[program:emby]
command=/opt/emby-server/bin/emby-server -programdata /opt/media-server/config/emby -restartexitcode 3
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/emby.log
stdout_logfile=/opt/media-server/logs/emby.log

# ================================
# Content Management (*arr Suite - 5 services)
# ================================

[program:sonarr]
command=/opt/media-server/services/sonarr/Sonarr -nobrowser -data=/opt/media-server/config/sonarr
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/sonarr.log
stdout_logfile=/opt/media-server/logs/sonarr.log

[program:radarr]
command=/opt/media-server/services/radarr/Radarr -nobrowser -data=/opt/media-server/config/radarr
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/radarr.log
stdout_logfile=/opt/media-server/logs/radarr.log

[program:lidarr]
command=/opt/media-server/services/lidarr/Lidarr -nobrowser -data=/opt/media-server/config/lidarr
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/lidarr.log
stdout_logfile=/opt/media-server/logs/lidarr.log

[program:readarr]
command=/opt/media-server/services/readarr/Readarr -nobrowser -data=/opt/media-server/config/readarr
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/readarr.log
stdout_logfile=/opt/media-server/logs/readarr.log

[program:bazarr]
command=/opt/media-server/services/bazarr/venv/bin/python /opt/media-server/services/bazarr/bazarr.py --no-update --config /opt/media-server/config/bazarr
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/bazarr.log
stdout_logfile=/opt/media-server/logs/bazarr.log

# ================================
# Indexers & Search (3 services)
# ================================

[program:prowlarr]
command=/opt/media-server/services/prowlarr/Prowlarr -nobrowser -data=/opt/media-server/config/prowlarr
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/prowlarr.log
stdout_logfile=/opt/media-server/logs/prowlarr.log

[program:jackett]
command=/opt/media-server/services/jackett/jackett --DataFolder=/opt/media-server/config/jackett --NoUpdates
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/jackett.log
stdout_logfile=/opt/media-server/logs/jackett.log

[program:flaresolverr]
command=/opt/media-server/services/flaresolverr/venv/bin/python /opt/media-server/services/flaresolverr/src/flaresolverr.py
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/flaresolverr.log
stdout_logfile=/opt/media-server/logs/flaresolverr.log
environment=LOG_LEVEL="info",PORT="8191"

# ================================
# Download Clients (5 services)
# ================================

[program:qbittorrent]
command=qbittorrent-nox --profile=/opt/media-server/config/qbittorrent --webui-port=8080
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/qbittorrent.log
stdout_logfile=/opt/media-server/logs/qbittorrent.log

[program:transmission]
command=transmission-daemon --foreground --config-dir /opt/media-server/config/transmission --download-dir /opt/media-server/downloads/complete --incomplete-dir /opt/media-server/downloads/incomplete
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/transmission.log
stdout_logfile=/opt/media-server/logs/transmission.log

[program:deluge-daemon]
command=deluged --do-not-daemonize --config /opt/media-server/config/deluge
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/deluge-daemon.log
stdout_logfile=/opt/media-server/logs/deluge-daemon.log

[program:deluge-web]
command=deluge-web --do-not-daemonize --config /opt/media-server/config/deluge
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/deluge-web.log
stdout_logfile=/opt/media-server/logs/deluge-web.log

[program:nzbget]
command=/opt/media-server/services/nzbget/nzbget -c /opt/media-server/config/nzbget/nzbget.conf -n
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/nzbget.log
stdout_logfile=/opt/media-server/logs/nzbget.log

[program:sabnzbd]
command=/opt/media-server/services/sabnzbd/venv/bin/python /opt/media-server/services/sabnzbd/SABnzbd.py --config-file /opt/media-server/config/sabnzbd --server 0.0.0.0:8085
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/sabnzbd.log
stdout_logfile=/opt/media-server/logs/sabnzbd.log

# ================================
# Request Management (3 services)
# ================================

[program:overseerr]
command=/usr/bin/node /opt/media-server/services/overseerr/dist/index.js
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/overseerr.log
stdout_logfile=/opt/media-server/logs/overseerr.log
environment=CONFIG_DIRECTORY="/opt/media-server/config/overseerr",PORT="5055"

[program:requestrr]
command=dotnet /opt/media-server/services/requestrr/dist/Requestrr.WebApi.dll
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/requestrr.log
stdout_logfile=/opt/media-server/logs/requestrr.log

[program:ombi]
command=/opt/media-server/services/ombi/Ombi --host http://*:3579 --storage /opt/media-server/config/ombi
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/ombi.log
stdout_logfile=/opt/media-server/logs/ombi.log

# ================================
# Analytics & Monitoring (2 services)
# ================================

[program:tautulli]
command=/opt/media-server/services/tautulli/venv/bin/python /opt/media-server/services/tautulli/Tautulli.py --config /opt/media-server/config/tautulli --datadir /opt/media-server/data/tautulli --nolaunch --quiet
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/tautulli.log
stdout_logfile=/opt/media-server/logs/tautulli.log

[program:netdata]
command=/usr/sbin/netdata -D -s /host -p 19999
user=netdata
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/netdata.log
stdout_logfile=/opt/media-server/logs/netdata.log

# ================================
# Dashboards (4 services)
# ================================

[program:homepage]
command=/usr/bin/node /opt/media-server/services/homepage/server.js
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/homepage.log
stdout_logfile=/opt/media-server/logs/homepage.log
environment=PORT="3000",HOMEPAGE_CONFIG_DIR="/opt/media-server/config/homepage"

[program:heimdall]
command=/usr/bin/php -S 0.0.0.0:7575 -t /opt/media-server/services/heimdall/public
user=media
directory=/opt/media-server/services/heimdall
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/heimdall.log
stdout_logfile=/opt/media-server/logs/heimdall.log

[program:organizr]
command=/usr/bin/php -S 0.0.0.0:8081 -t /opt/media-server/services/organizr
user=media
directory=/opt/media-server/services/organizr
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/organizr.log
stdout_logfile=/opt/media-server/logs/organizr.log

[program:homarr]
command=/usr/bin/node /opt/media-server/services/homarr/server.js
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/homarr.log
stdout_logfile=/opt/media-server/logs/homarr.log
environment=PORT="7575"

# ================================
# Infrastructure (4 services)
# ================================

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/nginx.log
stdout_logfile=/opt/media-server/logs/nginx.log

[program:nginx-proxy-manager]
command=/usr/bin/node /opt/media-server/services/nginx-proxy-manager/index.js
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/nginx-proxy-manager.log
stdout_logfile=/opt/media-server/logs/nginx-proxy-manager.log

[program:portainer]
command=/opt/media-server/services/portainer/portainer --data /opt/media-server/data/portainer --bind :9000
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/portainer.log
stdout_logfile=/opt/media-server/logs/portainer.log

[program:unpackerr]
command=/opt/media-server/services/unpackerr/unpackerr
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/unpackerr.log
stdout_logfile=/opt/media-server/logs/unpackerr.log
environment=UN_CONFIG_FILE="/opt/media-server/config/unpackerr/unpackerr.conf"

# ================================
# MCP Suite (Main Application)
# ================================

[program:mcp-suite]
command=/usr/bin/node /opt/media-server/mcp-suite/src/index.js
user=media
directory=/opt/media-server/mcp-suite
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/mcp-suite.log
stdout_logfile=/opt/media-server/logs/mcp-suite.log
environment=NODE_ENV="production",PORT="8090",CONFIG_ROOT="/opt/media-server/config",DATA_ROOT="/opt/media-server/data"

# ================================
# Update Service (Watchtower equivalent)
# ================================

[program:updater]
command=/opt/media-server/scripts/updater.sh
user=media
autostart=true
autorestart=true
stderr_logfile=/opt/media-server/logs/updater.log
stdout_logfile=/opt/media-server/logs/updater.log
startsecs=300
startretries=1