version: '3.9'

x-common-variables: &common-variables
  TZ: ${TZ:-America/New_York}
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}

x-security-options: &security-options
  security_opt:
    - no-new-privileges:true
    - apparmor:docker-default
  read_only: true
  tmpfs:
    - /tmp
    - /var/tmp
  cap_drop:
    - ALL

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

networks:
  # Isolated networks for better security
  frontend-net:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
      com.docker.network.bridge.enable_icc: "false"  # Disable inter-container communication
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
  
  backend-net:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1
  
  database-net:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/24
          gateway: 172.22.0.1
  
  monitoring-net:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
    ipam:
      driver: default
      config:
        - subnet: 172.23.0.0/24
          gateway: 172.23.0.1

volumes:
  # Named volumes with restricted access
  media-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_PATH:-./media-data}
  
  # Configuration volumes (read-only where possible)
  nginx-config:
    driver: local
  
  # Database volumes with encryption
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind,rw
      device: ${DB_PATH:-./postgres-data}

secrets:
  # Docker secrets for sensitive data
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  db_password:
    file: ./secrets/db_password.txt
  ssl_cert:
    file: ./secrets/ssl_cert.pem
  ssl_key:
    file: ./secrets/ssl_key.pem

services:
  # ==================== SECURITY REVERSE PROXY ====================
  
  traefik:
    image: traefik:v2.10
    container_name: traefik-secure
    <<: *security-options
    <<: *logging
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=frontend-net
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --log.level=INFO
      - --accesslog=true
      - --metrics.prometheus=true
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.http.tls.options=modern@file
      - --providers.file.filename=/etc/traefik/dynamic_conf.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik:/etc/traefik:ro
      - ./letsencrypt:/letsencrypt
    environment:
      - TRAEFIK_API_DASHBOARD=true
      - TRAEFIK_API_INSECURE=false
    networks:
      - frontend-net
      - backend-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.middlewares=auth-admin"
      - "traefik.http.middlewares.auth-admin.basicauth.users=${TRAEFIK_AUTH}"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.sslRedirect=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=63072000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== SECURITY MONITORING ====================
  
  security-monitor:
    build:
      context: ./security
      dockerfile: Dockerfile.monitor
    container_name: security-monitor
    <<: *security-options
    <<: *logging
    environment:
      <<: *common-variables
      NODE_ENV: production
      MONITORING_INTERVAL: 60000
      ALERT_THRESHOLD_REQUESTS: 1000
      ALERT_THRESHOLD_ERRORS: 0.1
      ENABLE_ANOMALY_DETECTION: "true"
      ENABLE_AUTO_RESPONSE: "true"
    volumes:
      - ./logs:/app/logs
      - ./security/config:/app/config:ro
    networks:
      - monitoring-net
      - backend-net
    depends_on:
      - redis-secure
    secrets:
      - jwt_secret
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== WEB APPLICATION FIREWALL ====================
  
  modsecurity:
    image: owasp/modsecurity-crs:nginx
    container_name: modsecurity-waf
    <<: *security-options
    <<: *logging
    environment:
      PARANOIA: 2
      ANOMALY_INBOUND: 5
      ANOMALY_OUTBOUND: 4
      BLOCKING_PARANOIA: 2
      PROXY: 1
      UPSTREAM: http://app-server:3000
    volumes:
      - ./config/modsecurity:/etc/modsecurity.d/custom:ro
    networks:
      - frontend-net
      - backend-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.waf.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.waf.tls.certresolver=letsencrypt"
      - "traefik.http.routers.waf.middlewares=security-headers,rate-limit"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.average=50"
    restart: unless-stopped

  # ==================== SECURE APPLICATION SERVER ====================
  
  app-server:
    build:
      context: .
      dockerfile: Dockerfile.secure
      args:
        NODE_ENV: production
    container_name: app-server-secure
    <<: *security-options
    <<: *logging
    environment:
      <<: *common-variables
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis-secure:6379
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres-secure:5432/mediadb
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ENABLE_SECURITY_MIDDLEWARE: "true"
      ENABLE_RATE_LIMITING: "true"
      ENABLE_CSRF_PROTECTION: "true"
      ENABLE_XSS_PROTECTION: "true"
      ENABLE_INPUT_VALIDATION: "true"
      SESSION_SECURE: "true"
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    volumes:
      - media-data:/app/media:ro
      - ./logs:/app/logs
    networks:
      - backend-net
      - database-net
    depends_on:
      - postgres-secure
      - redis-secure
    secrets:
      - jwt_secret
      - db_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ==================== SECURE MEDIA SERVERS ====================
  
  jellyfin-secure:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin-secure
    <<: *logging
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    environment:
      <<: *common-variables
      JELLYFIN_PublishedServerUrl: "https://jellyfin.${DOMAIN}"
      JELLYFIN_CONFIG_DIR: /config
      JELLYFIN_DATA_DIR: /data
      JELLYFIN_LOG_DIR: /logs
    volumes:
      - ./jellyfin-config:/config
      - ./jellyfin-data:/data
      - media-data:/media:ro
      - ./logs/jellyfin:/logs
    networks:
      - backend-net
    user: "${PUID}:${PGID}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jellyfin.middlewares=security-headers"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== SECURE DATABASE ====================
  
  postgres-secure:
    image: postgres:15-alpine
    container_name: postgres-secure
    <<: *security-options
    <<: *logging
    environment:
      POSTGRES_DB: mediadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - database-net
    secrets:
      - db_password
    command: 
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/ssl_cert
      - -c
      - ssl_key_file=/run/secrets/ssl_key
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== SECURE REDIS ====================
  
  redis-secure:
    image: redis:7-alpine
    container_name: redis-secure
    <<: *security-options
    <<: *logging
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --rdbcompression yes
      --rdbchecksum yes
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --tcp-keepalive 300
      --timeout 300
    volumes:
      - ./redis-data:/data
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== SECURITY SCANNING ====================
  
  vulnerability-scanner:
    build:
      context: ./security
      dockerfile: Dockerfile.scanner
    container_name: vuln-scanner
    <<: *security-options
    <<: *logging
    environment:
      SCAN_INTERVAL: 86400000  # 24 hours
      SEVERITY_THRESHOLD: MEDIUM
      AUTO_FIX: "false"
      ENABLE_DEPENDENCY_SCAN: "true"
      ENABLE_CONTAINER_SCAN: "true"
      ENABLE_CONFIG_SCAN: "true"
      ENABLE_SECRET_SCAN: "true"
    volumes:
      - .:/app/scan-target:ro
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring-net
    restart: unless-stopped
    profiles:
      - security-tools

  # ==================== INTRUSION DETECTION ====================
  
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata-ids
    <<: *logging
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    network_mode: host
    volumes:
      - ./config/suricata:/etc/suricata:ro
      - ./logs/suricata:/var/log/suricata
      - /var/lib/suricata/rules:/var/lib/suricata/rules:ro
    environment:
      - SURICATA_OPTIONS=-i any
    restart: unless-stopped
    profiles:
      - security-tools

  # ==================== LOG AGGREGATION ====================
  
  loki:
    image: grafana/loki:2.9.0
    container_name: loki-secure
    <<: *security-options
    <<: *logging
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki:/etc/loki:ro
      - ./loki-data:/loki
    networks:
      - monitoring-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail-secure
    <<: *security-options
    <<: *logging
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail:/etc/promtail:ro
      - ./logs:/var/log/app:ro
      - /var/log:/var/log/host:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring-net
    depends_on:
      - loki
    restart: unless-stopped

  # ==================== METRICS COLLECTION ====================
  
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-secure
    <<: *security-options
    <<: *logging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
      - '--web.external-url=https://prometheus.${DOMAIN}'
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - ./prometheus-data:/prometheus
    networks:
      - monitoring-net
      - backend-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prometheus.middlewares=auth-admin,security-headers"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== ALERTING ====================
  
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager-secure
    <<: *security-options
    <<: *logging
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alerts.${DOMAIN}'
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - ./alertmanager-data:/alertmanager
    networks:
      - monitoring-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alerts.${DOMAIN}`)"
      - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alertmanager.middlewares=auth-admin,security-headers"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== BACKUP SYSTEM ====================
  
  backup-manager:
    build:
      context: ./backup
      dockerfile: Dockerfile.backup
    container_name: backup-manager
    <<: *security-options
    <<: *logging
    environment:
      BACKUP_SCHEDULE: "0 2 * * *"  # Daily at 2 AM
      RETENTION_DAYS: 30
      ENCRYPTION_ENABLED: "true"
      BACKUP_DESTINATIONS: "local,s3"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET: ${BACKUP_BUCKET}
    volumes:
      - postgres-data:/backup/postgres:ro
      - ./config:/backup/config:ro
      - ./backup-storage:/backup/local
    networks:
      - database-net
    depends_on:
      - postgres-secure
    restart: unless-stopped
    profiles:
      - backup

# ==================== HEALTH CHECKS ====================
# All services include health checks for monitoring

# ==================== RESOURCE LIMITS ====================
# All services include appropriate resource limits

# ==================== SECURITY HARDENING ====================
# - No privileged containers
# - Read-only filesystems where possible
# - Dropped capabilities
# - User namespaces
# - Network segmentation
# - Secrets management
# - Security scanning
# - Monitoring and alerting