# Traefik v3.0 Configuration for Single Container Media Server
# API Gateway and Service Discovery for 30+ Services

global:
  sendAnonymousUsage: false

api:
  dashboard: true
  debug: false
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        options: modern@file

  # Direct service access ports
  jellyfin-direct:
    address: ":8096"
  
  plex-direct:
    address: ":32400"
    
  traefik-api:
    address: ":8080"

# Certificate management
certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@localhost
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

# Dynamic configuration providers
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
    
  http:
    endpoint: "http://localhost:8000/traefik/config"
    pollInterval: "30s"
    pollTimeout: "5s"

# Logging
log:
  level: INFO
  format: json
  filePath: "/var/log/traefik/traefik.log"

accessLog:
  format: json
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100
  filters:
    statusCodes: ["400-499", "500-599"]
    retryAttempts: true
    minDuration: "10ms"

# Metrics for Prometheus
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRouterLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

# Rate limiting and circuit breaker
serversTransport:
  insecureSkipVerify: true
  
# Health checks
ping:
  entryPoint: "traefik-api"

---
# Dynamic Configuration File: /etc/traefik/dynamic/services.yml

http:
  # Middleware definitions
  middlewares:
    # Authentication middleware
    auth-forward:
      forwardAuth:
        address: "http://localhost:8000/auth/verify"
        authRequestHeaders:
          - "X-Forwarded-User"
          - "X-Forwarded-Groups"
          - "X-Forwarded-Name"
          - "X-Forwarded-Email"
        authResponseHeaders:
          - "X-User-ID"
          - "X-User-Name"
          - "X-User-Groups"

    # CORS headers
    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
          - PUT
          - POST
          - DELETE
        accessControlAllowOriginList:
          - "http://localhost"
          - "https://localhost"
        accessControlMaxAge: 100
        addVaryHeader: true

    # Security headers
    security-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"

    # Rate limiting
    api-rate-limit:
      rateLimit:
        burst: 100
        period: "1m"
        average: 50

    ai-rate-limit:
      rateLimit:
        burst: 10
        period: "1m"
        average: 5

    # Circuit breaker  
    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.3 || ResponseCodeRatio(500, 600, 0, 600) > 0.3"
        checkPeriod: "3s"
        fallbackDuration: "10s"
        recoveryDuration: "10s"

    # Compression
    compression:
      compress:
        excludedContentTypes:
          - "text/event-stream"

  # Router definitions
  routers:
    # Main dashboard/homepage
    homepage:
      rule: "Host(`localhost`) && PathPrefix(`/`)"
      service: homepage-service
      entryPoints:
        - websecure
      middlewares:
        - auth-forward
        - security-headers
        - compression
      tls:
        certResolver: letsencrypt

    # Media Servers
    jellyfin:
      rule: "Host(`localhost`) && PathPrefix(`/jellyfin`)"
      service: jellyfin-service
      entryPoints:
        - websecure
      middlewares:
        - auth-forward
        - cors-headers
        - security-headers
        - compression
      tls:
        certResolver: letsencrypt

    jellyfin-direct:
      rule: "Host(`jellyfin.local`) || HostRegexp(`{subdomain:jellyfin.*}.localhost`)"
      service: jellyfin-service
      entryPoints:
        - jellyfin-direct
      middlewares:
        - auth-forward
        - cors-headers

    plex:
      rule: "Host(`localhost`) && PathPrefix(`/plex`)"
      service: plex-service
      entryPoints:
        - websecure
      middlewares:
        - auth-forward
        - cors-headers
        - security-headers
        - compression
      tls:
        certResolver: letsencrypt

    plex-direct:
      rule: "Host(`plex.local`) || HostRegexp(`{subdomain:plex.*}.localhost`)"
      service: plex-service
      entryPoints:
        - plex-direct
      middlewares:
        - auth-forward
        - cors-headers

    emby:
      rule: "Host(`localhost`) && PathPrefix(`/emby`)"
      service: emby-service
      entryPoints:
        - websecure
      middlewares:
        - auth-forward
        - cors-headers
        - security-headers
        - compression
      tls:
        certResolver: letsencrypt

    # *arr Stack Services
    sonarr:
      rule: "Host(`localhost`) && PathPrefix(`/sonarr`)"
      service: sonarr-service
      entryPoints:
        - websecure
      middlewares:
        - auth-forward
        - api-rate-limit
        - security-headers
        - compression
      tls:
        certResolver: letsencrypt

    radarr:
