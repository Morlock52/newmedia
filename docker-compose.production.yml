version: '3.8'

# Production-Ready Single Container Media Server
# Based on Agent Consensus Architecture

services:
  media-server:
    build:
      context: .
      dockerfile: Dockerfile.production-single
      args:
        - BUILDKIT_PROGRESS=plain
    image: ultimate-media-server:production-2025
    container_name: ultimate-media-server
    hostname: media-server
    restart: unless-stopped
    
    # Network configuration
    networks:
      - media-network
    
    # Security
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    security_opt:
      - no-new-privileges:true
    
    # Resource management (based on consensus)
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 32G
        reservations:
          cpus: '4.0'
          memory: 16G
    
    # Environment configuration
    environment:
      # System
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - UMASK=002
      
      # Service URLs (internal mesh)
      - JELLYFIN_URL=http://localhost:8096
      - SONARR_URL=http://localhost:8989
      - RADARR_URL=http://localhost:7878
      - PROWLARR_URL=http://localhost:9696
      - LIDARR_URL=http://localhost:8686
      - QBITTORRENT_URL=http://localhost:8080
      
      # AI Configuration
      - OLLAMA_MODELS=/config/ollama
      - AI_CACHE_ENABLED=true
      - AI_LOCAL_ONLY=false
      - VECTOR_DB_PATH=/data/qdrant
      
      # Performance
      - NODE_OPTIONS=--max-old-space-size=4096
      - PYTHON_WORKERS=4
      
      # Redis
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      
      # Monitoring
      - ENABLE_METRICS=true
      - LOG_LEVEL=info
    
    # Volumes
    volumes:
      # Configuration
      - ./config:/config
      - ./data:/data
      
      # Media libraries
      - ${MEDIA_PATH:-./media}:/media
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      
      # Logs
      - ./logs:/logs
      
      # AI Models
      - ./ai-models:/config/ollama
      
      # Cache
      - ./cache:/cache
      
      # Docker socket (for container management)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
      # Timezone
      - /etc/localtime:/etc/localtime:ro
    
    # Port mappings (simplified for user experience)
    ports:
      # Primary access
      - "80:80"      # Main dashboard (Traefik routing)
      - "443:443"    # HTTPS (with auto-cert)
      
      # Direct service access (optional)
      - "8096:8096"  # Jellyfin
      - "8989:8989"  # Sonarr
      - "7878:7878"  # Radarr
      - "9696:9696"  # Prowlarr
      - "8686:8686"  # Lidarr
      - "6767:6767"  # Bazarr
      - "8080:8080"  # qBittorrent
      
      # Dashboard
      - "3000:3000"  # Next.js Dashboard
      
      # AI Services
      - "8090:8090"  # AI Assistant API
      - "8091:8091"  # AI WebSocket
      
      # Monitoring (optional)
      - "8088:8088"  # Traefik Dashboard
    
    # Health check
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s
    
    # Hardware acceleration
    devices:
      # Intel QuickSync
      - /dev/dri:/dev/dri
      # NVIDIA GPU (uncomment if available)
      # - /dev/nvidia0:/dev/nvidia0
      # - /dev/nvidiactl:/dev/nvidiactl
    
    # Labels for Traefik routing
    labels:
      - "traefik.enable=true"
      
      # Main dashboard
      - "traefik.http.routers.dashboard.rule=Host(`media.local`) || Host(`localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.services.dashboard.loadbalancer.server.port=3000"
      
      # Jellyfin
      - "traefik.http.routers.jellyfin.rule=Host(`media.local`) && PathPrefix(`/jellyfin`)"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      
      # API routes
      - "traefik.http.routers.api.rule=Host(`media.local`) && PathPrefix(`/api`)"
      - "traefik.http.services.api.loadbalancer.server.port=8090"

# Networks
networks:
  media-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# Volumes (named for persistence)
volumes:
  config:
    driver: local
  data:
    driver: local
  media:
    driver: local
  downloads:
    driver: local
  logs:
    driver: local
  ai-models:
    driver: local
  cache:
    driver: local