name: Docker Build and Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build API image
        run: |
          docker build -f Dockerfile.api -t newmedia-api:ci .

      - name: Smoke test API image
        run: |
          docker run -d --name newmedia-api-test -e LOG_FORMAT=json -e LOG_DAILY_ROTATE=true -p 3002:3002 newmedia-api:ci || true
          sleep 5
          curl -fsS http://127.0.0.1:3002/health || true
          docker rm -f newmedia-api-test || true

      - name: Run realtime integration tests (if OPENAI API key provided)
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REALTIME_ENABLED: 'true'
        run: |
          npm ci
          npm run test:realtime
