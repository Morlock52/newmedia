<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Media Server - AI Powered</title>
    <meta http-equiv="refresh" content="0; url=http://localhost:3000/ai-central.html">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .redirect-message {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 3em;
            background: linear-gradient(90deg, #06b6d4, #6366f1, #8b5cf6);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .loading {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #6366f1;
            animation: spin 1s ease infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #06b6d4;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>🤖 AI Media Central</h1>
        <div class="loading"></div>
        <p>Redirecting to AI-powered dashboard...</p>
        <p><small>If you're not redirected, <a href="http://localhost:3000/ai-central.html">click here</a></small></p>
    </div>
</body>
</html>
