# ========================================
# SUPERVISOR CONFIGURATION FOR 30+ SERVICES
# Complete orchestration of all services
# ========================================

[supervisord]
nodaemon=true
user=root
logfile=/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[inet_http_server]
port=0.0.0.0:9001
username=admin
password=admin123

# ========================================
# DATABASE SERVICES (Start First)
# ========================================

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /config/postgresql -c config_file=/config/postgresql/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/logs/postgresql.log
stderr_logfile=/logs/postgresql_error.log
environment=PGDATA="/config/postgresql"

[program:redis]
command=redis-server /config/redis/redis.conf
user=redis
autostart=true
autorestart=true
priority=15
stdout_logfile=/logs/redis.log
stderr_logfile=/logs/redis_error.log

# ========================================
# MESSAGE QUEUE
# ========================================

[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
user=rabbitmq
autostart=true
autorestart=true
priority=20
stdout_logfile=/logs/rabbitmq.log
stderr_logfile=/logs/rabbitmq_error.log
environment=RABBITMQ_CONFIG_FILE="/config/rabbitmq/rabbitmq"

# ========================================
# REVERSE PROXY & AUTH (Start Early)
# ========================================

[program:traefik]
command=/opt/traefik/traefik --configFile=/config/traefik/traefik.yml
user=traefik
autostart=true
autorestart=true
priority=30
stdout_logfile=/logs/traefik.log
stderr_logfile=/logs/traefik_error.log

[program:authelia]
command=/opt/authelia/authelia --config /config/authelia/configuration.yml
user=authelia
autostart=true
autorestart=true
priority=35
stdout_logfile=/logs/authelia.log
stderr_logfile=/logs/authelia_error.log

# ========================================
# MONITORING STACK
# ========================================

[program:prometheus]
command=/opt/prometheus/prometheus --config.file=/config/prometheus/prometheus.yml --storage.tsdb.path=/data/prometheus --web.console.libraries=/opt/prometheus/console_libraries --web.console.templates=/opt/prometheus/consoles --web.listen-address=0.0.0.0:9090
user=prometheus
autostart=true
autorestart=true
priority=40
stdout_logfile=/logs/prometheus.log
stderr_logfile=/logs/prometheus_error.log

[program:grafana]
